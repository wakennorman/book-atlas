name: 数据体检（发布门禁）

# 目的：让"数据坏了 / 小程序包没同步 / 代码语法错"在 PR 阶段就被拦住，
# 而不是等发布之后才在页面上发现。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # v0.146：`check-version-bump.mjs` 要靠 git 历史找「最后一次 bump CACHE 的提交」，
          # 默认的 fetch-depth=1 浅克隆会让它拿不到 base ⇒ 只能打印「跳过」。
          # 其它依赖 blame/log 的检查（如引文审计）同理受益。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # v0.165.5：原来写的是 20，**和本地（Node 22）不一致**，于是报
          #   `WebSocket is not defined` —— 全局 WebSocket 从 Node 21 才有（22 起默认开），
          #   20.20.2 上没有 ⇒ 20 个浏览器测试全部起不来 WebSocket。
          # 同一族病：本地绿、CI 红，而量程差藏在"CI 用的 Node 版本"里。统一到 22 = 与本地一致。
          # package.json 的 engines 也同步写死，免得下次有人只改一边。
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm install

      # v0.165 新增。**19 个浏览器测试（test/browser-locator.mjs 找的那一个）此前在 CI 上
      # 一次都没真跑过**，原因有两条，缺一不可：
      #   ① 19 个测试各自抄了一份「浏览器在哪」，清一色是 Windows 绝对路径
      #      （`C:\Program Files (x86)\Microsoft\Edge\…`）⇒ ubuntu-latest 上 `existsSync` 全 false；
      #   ② 更致命的是 `build.mjs` **漏了「找不到就跳过」的保护**（19 个里唯一）⇒
      #      `spawn(undefined)` 同步抛 `The "file" argument must be of type string`
      #      ⇒ 整个 job 崩掉 ⇒ 后面 14 个步骤全部 SKIP。
      # 实测后果：数据体检最后一次全绿是 2026-09-30，之后 34 次全红；而本地 55 步一直绿
      # （一直跑在 Windows 上），于是「本地绿 / CI 红」长期并存而没人发现。
      # 现在两处都修了：① 路径判断收敛到 test/browser-locator.mjs（认 Windows / macOS / Linux）；
      # ② 找不到浏览器时**退出码 2 而不是 0** —— 静默跳过才是「门禁全绿但什么都没测」的根源。
      #
      # ⚠ 这里**不装浏览器**：GitHub 的 ubuntu-24.04 镜像本来就带
      #   Google Chrome / Chromium / Microsoft Edge（见 actions/runner-images 的
      #   "Browsers and Drivers" 一节，2026-09 镜像为 154.x）。
      #   浏览器一直都在，缺的只是「代码认得它」。所以本步只做**自证**：
      #   打印用的是哪一个、什么版本，并且找不到就立刻红 —— 让"环境不对"当场暴露，
      #   而不是等到某个测试毫无线索地挂掉。
      # （v0.165 第一次提交时这里写的是"playwright 装 chromium，失败回落 apt 装 edge"，
      #  实测这步自己先失败了：playwright 装的 chromium 在 ~/.cache/ms-playwright/ 下、
      #  不在 PATH 上 ⇒ findBrowser() 找不到 ⇒ 自证 exit 1。多此一举，删掉。）
# （v0.165 第一次提交时这里写的是"playwright 装 chromium，失败回落 apt 装 edge"，
      #  实测这步自己先失败了：playwright 装的 chromium 在 ~/.cache/ms-playwright/ 下、
      #  不在 PATH 上 ⇒ findBrowser() 找不到 ⇒ 自证 exit 1。多此一举，删掉。）
      #
      # v0.165.4：自证**必须真的起一次浏览器**，光跑 `--version` 是不够的。
      #   v0.165.3 的教训：自证绿了（`Microsoft Edge 154.0.4258.53` 正常输出），
      #   但测试要的 `--remote-debugging-port + --headless=new` 那条路根本没人验过
      #   ⇒ 结果"自证绿、测试红"，又多花一整轮 CI 才定位到是 Linux 的沙箱问题。
      #   所以这里调 test/browser-locator.mjs 的 `cdpSmoke()`：
      #   **用测试真正使用的那套参数**起一次，并真的去敲 /json/list；
      #   起不来就把浏览器自己的 stderr 打出来（各测试原本 stdio:'ignore'，全扔了）。
      - name: 自证浏览器可用（19 个浏览器测试要用）
        run: |
          set -euo pipefail
          echo "平台：$(uname -srm)"
          node -e "
            import('./test/browser-locator.mjs').then(async (m) => {
              const b = m.findBrowser();
              if (!b) {
                const { paths, cmds, label } = m.browserCandidates();
                console.error('✗ 找不到浏览器（平台 ' + process.platform + '，口径 ' + label + '）');
                console.error('  试过的路径：\n    ' + paths.join('\n    '));
                console.error('  试过的命令：' + cmds.join('、'));
                process.exit(2);
              }
              console.log('✓ 浏览器：' + b);
              const { execFileSync } = await import('node:child_process');
              let ver = '(取不到版本号)';
              try {
                ver = execFileSync(b, ['--version'], { encoding: 'utf8', timeout: 30000 }).trim();
              } catch (e) {
                console.error('  ✗ --version 跑不起来：' + e.message);
                process.exit(2);
              }
              console.log('  版本：' + ver);
              console.log('  追加的启动标志：' + JSON.stringify(m.browserArgs()));
              console.log('  ── CDP 冒烟（用测试真正的那套参数起一次）──');
              const r = await m.cdpSmoke();
              if (!r.ok) {
                console.error('  ✗ 浏览器起来了，但 CDP 端点没出现（' + r.secs + 's，端口 ' + r.port + '）');
                console.error('    19 个浏览器测试都会以「CDP 没起来」失败 —— 这里红比在那里红得早，而且有线索。');
                console.error('  ── 浏览器自己的输出（尾部）──');
                console.error(r.stderr);
                process.exit(2);
              }
              console.log('  ✓ CDP 端点已就绪（' + r.secs + 's，端口 ' + r.port + '）');
            });
          "
      - name: JS 语法检查
        run: |
          for f in js/app.js js/editor.js \
                   miniprogram/utils/graph.js miniprogram/utils/render.js miniprogram/utils/card.js \
                   miniprogram/pages/index/index.js miniprogram/app.js \
                   shared/graph-core.js scripts/bump-version.mjs scripts/check-version.mjs \
                   scripts/check-version-bump.mjs scripts/make-slim-packs.mjs scripts/check-sw-precache.mjs scripts/check-event-chars.mjs scripts/check-name-form-ledger.mjs scripts/check-altnames-ledger.mjs scripts/check-kin-terms-exempt.mjs scripts/check-missing-ok.mjs scripts/check-surname-coverage.mjs \
                   test/smoke.mjs test/core.mjs test/e2e.mjs test/browser.mjs test/parity.mjs test/editor.mjs \
                   test/races.mjs test/relax.mjs test/relations.mjs test/lock.mjs test/render-scale.mjs test/roam.mjs \
                   test/canvas-hint.mjs test/version-bump-guard.mjs test/kin-constants.mjs test/kin-check.mjs test/parent-child.mjs test/gate-claims.mjs test/books-registry.mjs test/name-form-ledger-guard.mjs test/altnames-ledger-guard.mjs test/kin-terms-exempt-guard.mjs test/missing-ok-guard.mjs test/surname-coverage-guard.mjs \
                   test/browser-locator.mjs test/ai.mjs test/annotations.mjs test/band-labels.mjs test/build.mjs test/full-tip.mjs test/fullscreen.mjs test/gen-fill.mjs test/layout-stable.mjs test/place.mjs test/place-visible.mjs \
                   miniprogram/test/smoke.mjs sw.js eslint.config.js; do
            node --check "$f"
          done

      - name: 版本号一致性
        # v85：以前 v0.69–v0.71 连着三轮改前端却漏 bump CACHE（CHANGELOG 有记录），
        # 没有任何检查能发现。这里比对 sw.js / index.html / editor.html / js/editor.js / package.json。
        run: node scripts/check-version.mjs

      - name: 改了前端资源必须 bump 版本号
        # v0.146 新增。上一步 `check-version.mjs` 只查**一致性**（各处 ?v=NN 与 CACHE 是否彼此相等），
        # 查不出「该 bump 而没 bump」—— 全都没动也是一致的，检查照样通过。
        # 实测踩过：js/ 从 v0.131 到 v0.142 **至少 9 轮**改过前端，CACHE 却一直是 bookatlas-v99
        # ⇒ 老访客一直跑 v99 的代码。这正是 v85 出过、check-version.mjs 当初要防的那件事，换了个入口复发。
        # 判据（只用 git，不靠猜）：base = 最后一次改动 CACHE 的提交；
        # 若 base..HEAD 之间 index.html/editor.html/js//css//shared/ 变过 ⇒ 就是忘了 bump ⇒ exit 1。
        # 拿不到 git 历史（浅克隆等）⇒ 打印「跳过」exit 0（门禁里一条会误报的检查终会被 || true 吞掉）。
        run: node scripts/check-version-bump.mjs

      - name: 版本 bump 检查自身的守卫（证明它会报红）
        # v0.146 新增。上面那条检查本身就是为了防「判据存在但从不触发」，
        # 所以必须有一条测试**证明它真的会 exit 1** —— 否则它可能随时悄悄退化成空转
        # （自测时就踩过：`-G 'bookatlas-v\d'` 里的 `\d` 被 git 当字面 d ⇒ 永远找不到 base ⇒ 永远跳过）。
        # 做法：在临时目录 git init 一个最小仓库，把 BOOKATLAS_ROOT 指过去，逐场景断言退出码。不碰真实仓库。
        run: node test/version-bump-guard.mjs

      - name: 门禁声明一致性（注释自称的守卫必须真的存在）
        # v0.154 新增。check.yml 里曾有一条注释把某个只读审计说成「硬门禁」，
        # 而那个脚本**从没进过 run 步骤**、还恒 exit 0 —— 注释吹了牛。
        # 这比"没有守卫"更危险：读注释的人会以为这里有守卫，于是不去补。
        # 判据：扫注释 —— 含「硬门禁」的行 ±1 内出现的脚本名，必须真的在 run 步骤里。
        # 想说明"某脚本**不是**硬门禁"，就别把它的名字写在「硬门禁」旁边（隔 ≥2 行）。
        run: node test/gate-claims.mjs

      - name: 文件必须在仓库里（本地绿、CI 崩的经典来源）
        # v0.165.2 新增。起因是 v0.165 连续两次把 CI 推红，而本地门禁 55 步全绿：
        #   新建的 `test/_browser.mjs` **从未进过仓库** —— `.gitignore` 第 31 行 `_*.mjs`
        #   把它静默排除，`git add -A` 也不捡 ⇒ CI 上 ERR_MODULE_NOT_FOUND。
        #   同目录 `test/_profile-guard.mjs` 命中同一规则却好好活着，
        #   只因它在规则出现前就已提交（已跟踪文件不再受 ignore 约束）——
        #   **同类文件一个能活一个不能活，本地目录看不出区别。**
        # 判据两条：① check.yml 里引用的每个 .mjs 磁盘上必须存在（当场抓住本次故障）；
        #          ② test/ 与 scripts/ 下每个 .mjs 必须已入库，或命中临时文件例外名单。
        run: node test/helpers-tracked.mjs

      - name: 门禁步骤必须可能报红（形同虚设的步骤会显示"通过"）
        # v0.165.7 新增。2026-10-09 在 CI 上连抓三处假绿，同一个病：
        #   「步骤在 run 里、找不到东西就 process.exit(0)」⇒ 门禁显示通过，
        #   而它一条断言都没跑（test/browser.mjs + 四个「拿不到 CDP ⇒ 跳过」）。
        #   现有的 test/gate-claims.mjs 守的是「注释自称的守卫必须在 run 步骤里」，
        #   它能发现注释吹牛，发现不了「步骤在、却永远不会红」—— 后者更隐蔽，
        #   因为文件名和 run 步骤都齐整，任何清单式核对都会认为它没问题。
        # 判据：run: node X 的 X 必须含非零退出路径；豁免必须写明
        #   GATE_MAY_ALWAYS_SUCCEED: <为什么>，没理由的豁免等于没豁免。
        # ⚠ 按语义判不按字面判：process.exit(fail === 0 ? 0 : 1) 是能报红的
        #   （1 在假分支里）；第一版只认字面量 process.exit(1)，误判过。
        run: node test/gate-effectiveness.mjs

      - name: 拆分数据包与 data/*.json 同步
        # v85 新增。首屏只下 <slug>.graph.json，文案在空闲时后台预取。
        # 改了 data/*.json 忘了重跑生成脚本 ⇒ 首屏会拿到过期（甚至缺文案）的数据。
        # 这一步同时校验"两份合起来 == 源文件"，剧透判定依赖的字段少一个都会失败。
        run: node scripts/make-slim-packs.mjs --check

      - name: graph/text 包的人物字段覆盖
        # v0.97 新增。`make-slim-packs.mjs --check` 只能发现"忘了重新生成"，
        # 发现不了"**生成脚本的白名单里漏了这个字段**"。
        # 实测踩过：`altNames`（又译）从 v0.95 接进前端、v0.97 填了 27 条真实译名，
        # 却因为白名单漏了它 ⇒ 网页端两个包里都没有它 ⇒ 浏览器里「又译」一条都不显示，
        # 而门禁全绿（前端那几条断言用的是运行时注入的探针 altName，绕过了数据通路）。
        # 判据是「源数据里有值、而 graph.json 与 text.json 里都没有」。
        run: node scripts/check-graph-fields.mjs

      - name: 拆书素材文档与 data/*.json 同步
        # v0.145 新增。`scripts/make-anno-digest.mjs` 的文件头一直写着「--check 进 CI」，
        # 但 check.yml 里从来没有这一步 —— 于是它**没进 CI**。
        # 后果实测过：改完 data/three-kingdoms.json 忘了重跑生成脚本，
        # `docs/拆书素材-*.md` 六份全过期（e-33-1 的在场人物与数据对不上），
        # 而门禁 31 步全绿。这正是本项目反复踩的「改了等于没改」。
        # 判据：文档逐字由 data 重排而来 ⇒ 与数据必须逐字节一致（可复现、可 diff）。
        run: node scripts/make-anno-digest.mjs --check

      - name: 拆书标注校验（引用的 id 必须真实存在）
        # v0.145 新增。拆书条目是**唯一一块"由人/模型写、却当成事实展示"**的内容，
        # 风险最高，而此前没有任何门禁守它。
        # 卡死的四条：① events/chars 里的 id 必须真实存在于该书数据（防编造主闸门）
        #            ② ch 必须落在该书章号范围内
        #            ③ basis 必填（区分"原文"与"整理者推断"）
        #            ④ body/title 不得为空、不得是「待补/TODO」这类占位
        # 这是**硬门禁**（有问题即 exit 1），不是只读审计。
        run: node scripts/check-annotations.mjs

      - name: sw.js 预缓存清单与 books.json 一致
        # 网站会持续加书，而 sw.js 的 SHELL 里是硬编码每个图包的路径。
        # 忘了加不会白屏（/data/ 走 stale-while-revalidate），但会静默不一致。
        run: node scripts/check-sw-precache.mjs

      - name: 书目注册表与 data/ 实际内容一致（加书别忘登记）
        # v0.155 新增。「哪些是书」有两份定义、互不知情：
        #   · data/books.json 的 books[]（前端 + 约 10 个脚本读它）
        #   · scripts/lib/data-files.mjs 的 listBooks()（validate / derive-kin / 对质读它）
        # 加书是**手动**步骤（books.json 的 noteAddBook 列了 5 步）—— 手动 = 会忘。
        # 忘了登记的后果是**门禁假绿**：新书会被 listBooks() 系检查到（看着"查过了"），
        # 却被 books.json 系（check-annotations / check-event-chars / check-graph-fields /
        # check-packs-sync / check-sw-precache / 前端）**全部静默跳过**。
        # 判据（双向）：登记的 file/graphFile/textFile 都存在 · slug 与 file 一致 ·
        #               listBooks() 与 books.json 的书目集合相等。
        run: node test/books-registry.mjs

      - name: 采用名字台账的引用完整性（台账说几条 ≠ 真正生效几条）
        # v0.160 新增。`data/<slug>.name-form-ok.json` 申报「主名不是原书原样字」的人物，
        # 消费方是 `scripts/audit-against-text.mjs --names` —— 但它要**原著文本**，
        # 而原著不在仓库里（见 docs/新书处理规程.md：「这一类错在版本库里查不出来」）
        # ⇒ 那条审计**进不了 CI**，于是这份台账此前**没有任何一处守着**。
        #
        # 台账有两个结构性弱点：
        #   ① 按 **name** 记账，而 name 是会变的（改名 / 删人 / 合并都动它）；
        #   ② 消费方**按主名查**（declared.get(c.name)）⇒ 键写成别名，这条申报
        #      根本不生效，可它看起来还好好地待在那儿。
        # 实测现场（本步写完当场抓到）：审计打印「已申报 11 个」，
        # 台账文件自己写着 `申报条数: 13` —— **两个数字都印在文件里，差 2 条，
        # 却没有任何一处报过**。差的两条：诸葛珪（v0.106 已连人删掉，条目留了 9 个版本）、
        # 戴陵（主名其实是戴凌，原著逐字 16 次，台账键却写成了别名）。
        #
        # 本步只做**引用完整性**（不需要原著 ⇒ 可以进 CI）：键必须是某人的主名
        # （只出现在别名里即报错）、申报条数 / 理由 / 唯一性要对得上、台账不能是孤儿文件。
        # 判据 E1–E7 见脚本文件头。**「该不该申报」仍归那条本地审计**，两者互补：
        # 本步管"台账还指不指得着人"，那条管"人有没有漏申报"。
        run: node scripts/check-name-form-ledger.mjs

      - name: 采用名字台账检查自身的守卫（证明它真的会报红）
        # v0.160 新增。上一步是"防台账悄悄失效"的检查，所以必须有一条测试
        # **证明它自己会 exit 1** —— 否则它随时可能退化成空转
        # （入口判断写成 `import.meta.url.endsWith(process.argv[1])` 就够了：
        #   本仓库目录名带空格 ⇒ 路径里的空格是 %20 编码 ⇒ 两边永远不相等 ⇒ 主流程一次都不跑，
        #   而退出码还是 0 —— "检查通过"其实是"检查没执行"）。
        # 做法：在 tmp 里造一份最小 data/，用 BOOKATLAS_ROOT 把 ROOT 指过去，
        # 逐场景断言退出码（1 个正常态 + 7 个期望报红 + 1 个形状兼容 + 1 个还原）。
        # 全程不碰真实仓库 —— 注入测试若直接改 data/ 下的真文件，中途崩了仓库就脏了。
        run: node test/name-form-ledger-guard.mjs

      - name: 又译出处台账与数据的一致性（台账说 26、数据 27）
        # v0.161 新增。`data/<slug>.altnames-sources.json` 记录每个人物 altNames（界面上
        # 显示为「又译 X」）的**出处**，`_说明` 里立着铁律「查不到出处的一个字都不许写」。
        # 但全仓搜 `altnames-sources`，只有 `scripts/lib/data-files.mjs` 的 SIDECAR 正则
        # （用来把它排除出"书"）和一句注释 —— **它没有任何消费者**：漂了、漏了、写错了，
        # 没有任何一处会响（与上一步的 name-form-ok 同一族）。
        # 实测现场（本步写完当场抓到，两处）：
        #   · 何塞·阿尔卡蒂奥（第二代）：数据里是「霍塞·阿卡迪奥」，台账写「霍塞·阿卡迪奥第二」
        #     —— 那是**修正前的旧值**（黄锦炎靠"带不带姓"区分父子，光杆的是儿子；那次把
        #     「第二」从第二代身上挪走了，台账没跟着改）。
        #   · 布鲁诺·克雷斯皮：数据里有 `altNames: ["布鲁诺·克雷斯比"]`，台账根本没有这一条。
        # 而且它自己的 `altNames 计数: 26` 与数据的 **27** 对不上 —— 又是
        # 「两个数字都印在文件里、差 1、没人报过」（v0.155 / v0.156 / v0.160 同一族）。
        #
        # 判据 A1–A8 见脚本文件头（**不需要原著文本**，所以能进 CI）：主力是 **A5 逐人双向比对**
        # （数据该人的 altNames ⇄ 台账该人的又译，必须完全相同），本次两处漂移都是它抓的。
        # ⚠ 有一条判据被**否掉**了：「已拒绝的候选里的又译不得出现在数据 altNames 里」——
        #   真实数据里 `小邦迪亚／邦迪亚上校` 的拒绝理由是"S1 已给出、**不重复登记**"，
        #   它本来就在数据里。「拒绝」= 不再登记进 `明细`，不等于不进数据。
        run: node scripts/check-altnames-ledger.mjs

      - name: 又译出处台账检查自身的守卫（证明它真的会报红）
        # v0.161 新增。上一步是"防一份没有任何消费者的台账悄悄漂掉"的检查，所以必须有一条
        # 测试**证明它自己会 exit 1** —— 否则它随时可能退化成空转
        # （入口判断写成 `import.meta.url.endsWith(process.argv[1])` 就够了：本仓库目录名带空格
        #   ⇒ 路径里的空格是 %20 编码 ⇒ 两边永远不相等 ⇒ 主流程一次都不跑，退出码还是 0）。
        # 照 version-bump-guard / name-form-ledger-guard 的先例：tmp 里造一份最小 data/，
        # 用 BOOKATLAS_ROOT 把 ROOT 指过去，逐场景断言退出码
        # （**1 个正常态 + 10 个期望报红 + 1 个还原**）。全程不碰真实仓库。
        run: node test/altnames-ledger-guard.mjs

      - name: 称谓对质豁免清单的引用完整性（按 id 记账，id 会变）
        # v0.162 新增。`data/kin-terms-exempt.json` 记「手写称谓与族谱算出来的不一致、
        # 但**是有意**」的关系对，每条 `{book,from,to,reason}`（from/to 是**人物 id**）。
        # 消费方只有 `check-kin-terms.mjs` 的 `isExempt(bookId,from,to)`，而它有两处**静默**：
        #   ① JSON 解析失败 ⇒ `catch { return [] }` ⇒ 整份清单**悄悄变成空名单**；
        #   ② `reason` 短于 8 字 ⇒ `isExempt` 返回 false ⇒ 这条豁免**不生效**（文件里却看着还在）。
        # 危险在于：这两条豁免的对象（孙权—孙桓）族谱**本来就算不出来**（孙河无父母记录）
        # ⇒ 对质循环里 `if (!k.term || k.kind === 'unrelated') continue;` 直接跳过它们
        # ⇒ **解析失败 / 理由太短 / 指错人，跑出来和一切正常一模一样**。
        # 加上它按 **id** 记账，而 id 会变（改名 / 删人 / 合并都动它）。
        #
        # 判据 K1–K7 见脚本文件头（**不需要原著文本**，所以能进 CI）：
        # 结构 / 必填 / **reason ≥8 字（与消费方门槛逐字一致）** / book 真实 /
        # from·to 是真实 **id** / 不重复 / from≠to。
        # ⚠ 两条**刻意不做**的判据：① 不检查"这条关系是否存在于数据里" —— 清单**允许**
        #   "关系已不存在、只为留依据防改错"的条目（sun-quan→sun-huan 的理由里明写）；
        #   能安全检查的是"**人**在不在"，不是"**关系**在不在"。
        #   ② 不检查 reason 有没有注明来源类型 —— 那属于人工评审，不是机器判据。
        run: node scripts/check-kin-terms-exempt.mjs

      - name: 称谓对质豁免清单检查自身的守卫（证明它真的会报红）
        # v0.162 新增。上一步是"防一份只有 2 条、坏掉也没人看得出"的清单悄悄失效的检查，
        # 所以必须有一条测试**证明它自己会 exit 1** —— 否则它随时可能退化成空转
        # （入口判断写成 `import.meta.url.endsWith(process.argv[1])` 就够了：本仓库目录名带空格
        #   ⇒ 路径里的空格是 %20 编码 ⇒ 两边永远不相等 ⇒ 主流程一次都不跑，退出码还是 0）。
        # 照前几个守卫的先例：tmp 里造一份最小 data/（一本 demo 书 + 豁免清单），
        # 用 BOOKATLAS_ROOT 把 ROOT 指过去，逐场景断言退出码
        # （**2 个正常态 + 11 个期望报红 + 1 个还原**）。
        # ⚠ 它 import 的 `lib/data-files.mjs` 也认这个变量（v0.162 起），
        #   否则 `listBookSlugs()` 看不见 tmp 里的书、"book 不存在"这类判据就测不了。
        run: node test/kin-terms-exempt-guard.mjs

      - name: 噪声忽略名单的一致性（忽略条目不得恰好等于真名）
        # v0.163 新增。`data/<slug>.missing-ok.json` 是 `audit-against-text.mjs` 的
        # **噪声忽略名单**（人判过"确实不是人名"的候选写进去，下次不再报）。
        # 它靠**名字**记账，而名字会变（建档 / 改名 / 删人 / 加别名都动它）。
        # 消费方按「候选不在 okSet 里」判 —— 一旦名单里的名字**变成了真名**，那条目
        # **永远不会被读到**（真名在候选提取前就被屏蔽了）：
        #   · 是**人物**真名 / 别名 / 译名 ⇒ **自相矛盾**（名单说"不是人名"，数据里却有这个人），
        #     而且**哪天这个人被改名 / 删掉，它会把他重新冒出来的候选静默吃掉**；
        #   · 是**地点**名 ⇒ 同样被屏蔽 ⇒ 这条目是**死的**。
        # 实测现场（本步写完当场抓到）：三国第 209 条「车冑」、第 276 条「刘繇」都恰好是
        # 数据里人物的**主名**（che-zhou / liu-yao）；而且那份文件的 `_说明` 还写着
        # 「书里确实还有些没建档的人（车冑、潘璋、严颜、张鲁…）」—— 这**四个现在全在数据里**。
        #
        # 判据 M1–M7 见脚本文件头（**不需要原著文本**，所以能进 CI）：
        # 数组 / 形状（字符串 或 `{name,why}`）/ 名字非空且不以 `_` 开头 / 去重 /
        # **why 非空** / **不得等于会被屏蔽的真名** / 孤儿名单。
        # ⚠ 一条刻意不做的判据：**子串**不算 —— 名单口径 ③ 明确允许
        #   "属于已有人物的别名或全名片段"（如「罗曼妲」＝尼格罗曼妲的名）。只有完全相等才是矛盾。
        run: node scripts/check-missing-ok.mjs

      - name: 噪声忽略名单检查自身的守卫（证明它真的会报红）
        # v0.163 新增。上一步是"防一份靠名字记账的名单悄悄失效"的检查，所以必须有一条测试
        # **证明它自己会 exit 1** —— 否则它随时可能退化成空转
        # （入口判断写成 `import.meta.url.endsWith(process.argv[1])` 就够了：本仓库目录名带空格
        #   ⇒ 路径里的空格是 %20 编码 ⇒ 两边永远不相等 ⇒ 主流程一次都不跑，退出码还是 0）。
        # tmp 里造一份最小 data/（一本 demo 书 + 忽略名单），用 BOOKATLAS_ROOT 把 ROOT 指过去，
        # 逐场景断言退出码（**3 个正常态 + 13 个期望报红 + 1 个反向 + 1 个还原**）。
        # 其中一条**反向**：名字是真人名的**子串**（甲 ⊂ 甲人）不许报红。
        run: node test/missing-ok-guard.mjs

      - name: 提取器盲区台账（产不出来的主名必须申报理由）
        # v0.164 新增。缺口检测（`audit-against-text.mjs` 找「书里提到、数据里没有的人」）
        # 靠 `/[百家姓][\u4e00-\u9fa5]{1,2}/` 产候选 ⇒ **产不出来的人，真漏了也永远不会
        # 进缺口清单**，缺口清单因此「看着干净」。实测三本书共 **183 个主名**落在盲区：
        #   · 百年孤独 **60 个主名一个都产不出来**、罪与罚 5/38、三国 792/882；
        #   · 成因①复姓/生僻姓/音译名首字不在那张**单字**百家姓表里（三国 63 人：
        #     皇甫嵩、桥玄、审配、沮授、典韦、貂蝉、太史慈、淳于琼…）；
        #   · 成因②全名太长，提取器只取 2~3 字（百年孤独 57 人、罪与罚 31 人，
        #     另有称谓型主名如「吴太夫人」「清河公主」）。
        # 本步**只把盲区显式化，不改提取器**：补复姓要动工具行为，而仓库没有原著文本
        # （`.text/` 被 gitignore）⇒ 改完无法实测召回变化，要动先按新书处理规程 §四 0.5/0.6
        # 备好原文本地跑一次对比。
        # 判据里最要紧的是 **C0**：本检查**直接解析 audit-against-text.mjs 的真实规则**
        # （SURNAMES / surnameRe 长度区间 / norm 字符类），解析不到就 exit 1 —— 门禁与工具
        # 同源；哪天提取器放宽（补复姓），台账里的旧豁免会**逐条报红过期**，照着删。
        run: node scripts/check-surname-coverage.mjs

      - name: 提取器盲区台账检查自身的守卫（证明它真的会报红）
        # v0.164 新增。tmp 里造最小 data/（books.json + demo 书 + 台账）**和一份
        # audit-against-text.mjs 副本**（检查要解析它），用 BOOKATLAS_ROOT 把 ROOT 指过去，
        # 逐场景断言退出码（**2 个正常态 + 10 个期望报红 + 1 个反向 + JSON 坏 + 孤儿台账
        # + C0 同源三档 + 1 个自失效 + 1 个还原** = 21 条）。
        # 两条值得单说的：
        #   · **C0 同源三档**：把 tmp 里那份工具的 SURNAMES / norm / surnameRe 分别改坏，
        #     三档都必须 exit 1 —— 宁可报红，不猜一套默认值跑出假绿；
        #   · **自失效**：往姓氏表里加一个字（丽），「丽贝卡」的豁免立刻变过期报红
        #     ⇒ 台账不会随着工具变强而变成没人信的垃圾堆。
        run: node test/surname-coverage-guard.mjs

      - name: ESLint 代码检查
        # v85：原先结尾是 `|| true`，而 ESLint 9 已不认 .eslintrc.json —— 这一步一直在崩溃，
        # 又被 || true 吞掉，门禁是"假绿"的。现在改用 eslint.config.js，并且不再吞错误。
        run: npx eslint js/ miniprogram/utils/ miniprogram/pages/ scripts/ shared/ test/ --ext .js,.mjs

      - name: 网页版核心逻辑冒烟测试
