        # 目前 5 处一致，但此前**没有任何测试守着**：某端单独改一个标签，
        # 就会出现「同一个 kin 在网页显示 A、在小程序显示 B」这种**用户可见**的不一致，而门禁全绿。
        # 判据：读各文件源码抽常量、与权威逐键比对（连「漏抄一个键」也能抓到）。
        run: node test/kin-constants.mjs

      - name: checkKin 规则金标（kin 与 type 自洽的唯一判据）
        # v0.150 新增。`checkKin` 是「亲属类型（kin）与关系名（type）是否自洽」的**唯一判据**，
        # validate.mjs 靠它报错（v0.147 收紧后「非 blood 配纯血缘称谓」是 error，
        # 正是靠它抓出「吴懿—刘璋 舅甥 + kin=inlaw」那两条）。但它此前**零测试覆盖**。
        # 钉返回的 level 序列（结构），不钉文案 —— 文案会改，语义不会。
        run: node test/kin-check.mjs

      - name: 亲子边定义跨端一致性（含「养父子」这类收养边）
        # v0.153 新增。「哪条关系算亲子边」这个定义在项目里抄了 **8 份以上**，已漂出 3 种行为：
        #   · 权威    scripts/kin-terms.mjs 的 isParentChild（含「养父子」）
        #   · 漏「养」 scripts/fix-gongsun.mjs / fix-wu-tail.mjs（一次性补丁，显式豁免）
        #   · 只认血缘 js/editor.js 的「亲子成环」检测 ⇒ 全部收养亲子边对编辑器不可见
        #              （三国 7 条、百年孤独 2 条）
        # 这不是新问题：scripts/lib/data-files.mjs 把它列为「同一个定义抄多份」的第 ① 例（v0.110），
        # 当时改了那三个审计脚本却**没加判据**，于是又漂了一次。
        # 判据：源码级（编辑器那份与权威逐字相同）+ 结构级（不许出现第 3 份 / 「缺养」变体）
        #       + 金标（钉「正确」而非「现状」）。浏览器侧的两条在 test/editor.mjs 里。
        run: node test/parent-child.mjs

      - name: 亲属称谓对质（手写 type 必须与族谱算出来的一致）
        # 起因 v0.99：用户报「上校—叔侄（伯父与侄）—奥雷里亚诺第二」
        # 说"第二代和第四代怎么可能只是叔侄"。手打的称谓字符串不可能自洽，
        # 而 derive-kin.mjs 有「已有直接关系的两个人不再推导」⇒ 错的标签
        # 还会把正确的推导边一起挡掉。本步让错标签**自己报出来**。
        # 族谱覆盖不足的书会整体跳过（那是数据没录全，不是缺陷）。
        #
        # ⚠ v0.115 追加 --coverage=0：那个 15% 是**代理指标**，
        #   当初存在的理由（族谱薄且未校验 ⇒ 容易误报）已被更直接的结构检查取代：
        #   audit-kin-gender 查 type 与 gender 是否自洽（**硬门禁**，见下方步骤）。
        #   （v0.154 更正）这里原先还写着另一个只读审计也是硬门禁 —— **那是错的**：
        #   它从没进过 run 步骤、还恒 exit 0，只是人工报告；判据又依赖 generation，
        #   而 generation 是部分填写的（多数人物默认 1）⇒ 含噪声，不能当判决。
        #   实测三本书在 coverage=0 下**全部 0 不一致**（三国 148 / 百年孤独 54 / 罪与罚 7），
        #   所以"跳过"今天已经挡不住任何东西 —— 继续靠跳过装作没事，不如真去跑。
        #   这一步**不改门槛默认值**，只是让门禁真的检查到三国。
        run: node scripts/check-kin-terms.mjs --all --coverage=0

      - name: 关系引文的行为人审计（引文存在 ≠ 引文支持这条关系）
        # 起因 v0.101：用户抓出一条**引文真实、行为人挂错**的关系 ——
        # 把「奥雷里亚诺第二哼着好汉弗朗西斯科的歌」挂到了上校名下，
        # 而且「师徒」这个关系类型是我编的。
        # **只出报告、退出码 0**：A/B 两级实测几乎全是误报（原文用简称、
        # 用「张、戴二人」代指两个人、代词指的正是关系一方），
        # 拿它当门禁会天天误报。这份报告是给人看的，不是判决。
        run: node scripts/audit-relation-actors.mjs

      - name: 行为人审计台账（读过的高风险条目必须登记，新冒出来的必须重读）
        # v0.179 新增。上面那一步只出报告、恒退出 0 —— 于是"报告里有 9 条高风险"
        # 这件事**没有任何判据接着**：没人看就等于没有。
        # 台账 `data/relation-actors-ok.json` 按 **(book, from, to)** 记"已回原著读过"的条目，
        # 判据 L1–L10：
        #   L1 数组 / L2 形状 / L3 why≥8 字 / L4 flags 在闭集 A|B|C / L5 书存在 /
        #   L6 from,to 是人物 id / L7 该书里真有这条边 / L8 去重 /
        #   L9 台账记的级别 == 审计现在报的级别（多记 = 漂移）/
        #   L10 **双向**：审计报出的每一条都必须在台账里。
        # ⚠ **L9/L10 里的 B、C 两级需要原著**（`%TEMP%\opencode\ba-books\`），原著不进版本库
        #   ⇒ **CI 上只核 A 级**，脚本会**打印**它收窄了范围（不静默跳过）。
        # ⚠ 判据从 `scripts/audit-relation-actors.mjs` **import**（该脚本 v0.179 改成了可导入），
        #   不在门禁里抄第二份。
        run: node scripts/check-relation-actors-ledger.mjs

      - name: 行为人审计台账检查自身的守卫（证明它真的会报红）
        # v0.179 新增。25 条断言：夹具自检 2 + L1 三条 + L2/L3 四条 + L4 三条 +
        # L5/L6/L7 四条 + L8 一条 + L9 一条 + L10 两条 + **缺原著时 B/C 转为「未核」** 三条
        # + 还原 1 条。
        # ⚠ 同其余守卫：**刻意不起子进程**（本机 spawnSync 一律 EBUSY），
        #   直接 import `checkRelationActorsLedger(root, {dir})`，
        #   在 tmp 里造一份最小 data/ + 一份假三国 txt（书**故意用真 slug**
        #   `three-kingdoms`，否则原著文件名查不到、B/C 永远"缺原著"，测不出来）。
        run: node test/relation-actors-ledger-guard.mjs

      - name: ④「去括号后同名」已核台账（7 组三国 + 1 组百年孤独）
        # v0.181 新增。`audit-search.mjs` 的 ④ 桶列「去掉括号补充后名字相同的多个人物」，
        # 它**分不清**两种情况：① 同一人被拆成两条；② 真有两个同名的人。
        # 本轮把三本书的全部 ④ 组逐条回原著读完（**7 + 1 + 0 = 8 组**），结论**全部真重名**：
        #   · 6 个主名**原本是裸名重名**，已补括号（张温×2 / 邓贤×2 / 李丰 / 王颀）；
        #   · 其余组本来就带括号（王颀（长安）/刘氏×3/张南/李氏×2/何塞·阿尔卡蒂奥×2）。
        #   毛宗岗夹注直接点明其中两组：「同时有两张温。此一张温，乃汉张温也；后孙权使张温至蜀，乃吴张温也」
        #   与「李丰有二，李严之子亦名丰，乃蜀之李丰也。今此李丰，则魏之李丰」—— **原著自己承认是两个人**。
        #
        # 本步的作用是让 ④ 从「永远在报」变成「只报**新冒出来**的组」。
        # 判据 L1–L10 见脚本文件头（**不需要原著**，所以能进 CI），其中要紧的四条：
        #   L5 台账的组在数据里必须**确实存在**（组被合并 ⇒ 台账过期）；
        #   L7 台账成员与数据**完全相等**（多记＝漂移，少记＝有人没核过）；
        #   L9 **双向**：数据里每组 ④ 撞车都必须登记；
        #   L10 每组成员主名**必须都带括号**（本项目约定「同名多人必须带括号区分」）。
        # ⚠ 缺台账**不算通过**：当作空台账继续判，于是 `rm` 掉名单会让 8 组全报红
        #   —— 删掉名单让门禁变绿，是最坏的一种假绿（v0.160 那条的镜像）。
        # ⚠ ④ 的分组规则放 `scripts/lib/dup-names.mjs`，审计与门禁都从它取 —— 不抄第二份
        #   （`audit-search.mjs` 是顶层就干活的脚本，门禁 import 它会被它的 process.exit(1) 杀掉）。
        run: node scripts/check-dup-names-ledger.mjs

      - name: ④ 台账检查自身的守卫（证明它真的会报红）
        # v0.181 新增。36 条断言：夹具自检 3 + **20 条「期望报红」**（每条判据各一条）
        #   + 1 条 JSON 坏 + 5 条反向（半角括号也算带括号 / 三人的组 / 独苗不进组 /
        #   一半带括号一半不带**仍然**报红 / 台账为空时裸名照样报红）。
        # ⚠ 同其余守卫：**刻意不起子进程**（本机 spawnSync 一律 EBUSY），
        #   直接 import `checkDupNamesLedger(root)`，在 tmp 里造两本 mini 书。
        #   ⚠ 它当场抓到**两个真 bug**，都是「门禁看起来在守、其实某条判据恒绿」：
        #   ① 「缺台账 ⇒ 0 处问题」——照抄其余台账的写法，结果 `rm` 掉名单就全绿；
        #   ② L8 的错误挂在了条目的 `error` 字段上，而主循环只 `push` 合法条目的结果
        #      ⇒ **重复登记一条都不报**（守卫里那条用例恒绿，是守卫抓到的，不是猜的）。
        run: node test/dup-names-ledger-guard.mjs

      - name: 台账引文是「印刷版逐字」（防把转述装成引文）
        # v0.182 新增。v0.102 真的放过一条**伪造引文**，`verify-quotes.mjs` 与
        # `audit-relation-actors.mjs` 的 C 级守着**关系引文** —— 但**台账 `why` 栏里的引文**
        # 此前没有任何一处检查。而台账恰恰是「人回原著读过」的结论所在。
        # 实测（本步写完当场抓到，3 条全是真缺陷）：
        #   · `dup-names-ok.json` 百年孤独那条：「何塞阿尔卡蒂奥」漏了**间隔号**（原书作「何塞·阿尔卡蒂奥」）——
        #     它之前"查得到"是因为 `flatSource()` 连 `·・･` 一起删了，**逐字口径被掩盖了**；
        #   · `first-ch-ok.json`：「江夏张虎」—— 原书脚注标记 `[202]` 正好插在两字之间
        #     （「一个是江夏[202]张虎」），所以这四字连写**从不出现**。这就是 MEMORY 记过的
        #     **脚注标记坑**，只是这次出现在台账里、没人查。
        #
        # 判据（见脚本文件头）：**引文点名了本条台账的主语 ⇒ 必须是印刷版逐字**。
        # ⚠ 为什么不查**全部**「」：实测全查 99 条会红 29 条，而那 29 条多数**根本不是引文**
        #   （「」还被用来给一个说法命名，如「钟邓结怨」）⇒ 纯噪声门禁会被忽略，比没有更坏。
        # ⚠ 口径：只去空白、**保留间隔号**；而"有没有点名主语"那一步**要**归一间隔号。两种口径各司其职。
        # ⚠ 「引号 = 声明这是原文」：要写原书里没有的说法，**别给它加引号**。
        # ⚠ **需要原著 ⇒ CI 上恒跳过**，脚本会**打印**它跳过了（不静默）。
        run: node scripts/check-ledger-quotes.mjs

      - name: 台账引文检查自身的守卫（证明它真的会报红）
        # v0.182 新增。23 条断言：夹具自检 3 + 2 条「期望报红」+ 2 条坏台账 + 6 条反向。
        # 值得单说的三条反向：
        #   · **命名说法不加引号**（钉住"引号 = 声明是原文"这条约定）；
        #   · **掉了间隔号的引文仍然报红**（去间隔号后能查到**不算数**）；
        #   · **缺原著必须打印「未判」**（v0.173 教训：门禁不打印跳过了什么，绿就等于装饰品）。
        # ⚠ 同其余守卫：**刻意不起子进程**（本机 spawnSync 一律 EBUSY），
        #   直接 import `checkLedgerQuotes(root, {sourceDir})`，在 tmp 里造最小 data/ 与假 txt。
        run: node test/ledger-quotes-guard.mjs

      - name: 噪声台账读取库的守卫（防「库写了、忘了接」）
        # v0.183 新增。`audit-search.mjs` 的 ③ 现在读 `data/<slug>.missing-ok.json`，
        # 读取逻辑放在 `scripts/lib/missing-ok.mjs`（本文件顶层就干活，守卫不能反过来 import 它）。
        #
        # 本仓库最常见的病是「判据/库写了、忘了接」—— 测试也绿，可消费方压根没 import。
        # `test/gate-claims.mjs` 守的是"注释自称的守卫必须在 run 步骤里"；
        # 这里守的是更靠里的一层：**lib 必须真的被它声称的那个脚本用上**。
        # 24 条断言：读取 6 + **缺/坏名单必须能区分** 5 + 过滤 4 + 接线 4 + 入口卫生 3 + 真实仓库形状 1。
        # 值得单说的两条：
        #   · **名单 JSON 坏了 ⇒ 报 error，而不是静默当空名单** ——
        #     静默会让**判过的噪声全部复活**，且现象是"报告变多"，看着像有新缺口；
        #   · 过滤**只认精确相等、不认子串**（与 check-missing-ok 的 M6 同一口径）。
        # ⚠ 同其余守卫：**刻意不起子进程**（本机 spawnSync 一律 EBUSY），直接 import 判据。
        run: node test/missing-ok-lib-guard.mjs

      - name: 「只含正文」切分库的守卫
        # v0.184 新增。那份原著 txt 是**毛宗岗评点本**，混着四类东西：
        #   ① 正文 ② 回末评点 ③ 音注 ④ **编者附录**（版本分析／参考书目／古今地名对照表／
        #   注释／群英谱／作者介绍）。④ 里的 `罗贯中` `毛宗岗` `山东省` `毛本` `陈寿`
        #   **都不是这本书登场的人物**，却被当成"缺口"报出来。
        #   `audit-against-text.mjs` 现在默认只扫 ①，`--with-appendix` 退回全本。
        # 22 条断言，切分 3 + 附录排除 3 + 评点音注 3 + **子集性质 3** + 退化 2 + 阈值 1 + 接线 5 + 卫生 3。
        # 值得单说的三条：
        #   · **正文必须是全集的真子集** —— 正文里每一行都要能在全本里逐字找到。
        #     这条比"剔掉几条"更有用：它一破就是**真的丢原文**，而不是多报噪声；
        #   · **切不出回的书必须退化成「切不出」而不是「切出个空串」** ——
        #     后者会让调用方的 `if (cut)` 判空失效，然后拿空文本去扫，
        #     报告变成"零缺口"，看着像"这本书没问题"，实则根本没扫；
        #   · 两条进度说明走 **stderr** —— `--json` 的消费者要 `JSON.parse(stdout)`，
        #     往 stdout 打一行提示就会让它崩（v0.184 当场踩到，报「Unexpected token '（'」）。
        # ⚠ 同其余守卫：**刻意不起子进程**（本机 spawnSync 一律 EBUSY），直接 import 判据。
        run: node test/main-text-guard.mjs

      - name: 「对着原著正文找漏人」判据库的守卫
        # v0.189 新增。起因是一个**报的数不是它算的数**的缺陷：
        # `audit-against-text.mjs` 把 `slice(0, topN)` 之后的窗口条数当成
        # "原著正文里扫出 N 个疑似漏人"印出来 ——
        # 《百年孤独》真实待判 280 条却印「5 个」，《罪与罚》708 条印「16 个」。
        # 更糟的是 `topN` 卡在"词的一部分"粗筛**之前** ⇒ 它既不是"前 N 条"，
        # 也不是"前 N 条像人名的"，两头不靠；于是"把清单判干净"在工具上永远做不到
        # （判掉几条高排名的，窗口就滑一格把下一档顶上来）。
        # 判据链改成"先质量筛、后显示截断"，并把 `待判总数 / 粗筛后 / 本页显示`
        # 三个数**分开报**；顺带修掉 `--top 0`（老写法 `slice(0,0)` = 一条都不显示）。
        # 判据本体抽到 `scripts/lib/against-text.mjs`（纯函数），本守卫直接 import。
        # 37 条断言：**顺序红绿证据** 5 + 报告文本 3 + 截断 2 + `--top 0` 3 + 台账扣除 4
        #   + 已知名/门槛 3 + norm/plain 4 + 结构性 3 + 接线 4 + 入口卫生 6。
        # ⚠ 值得单说的一条：第 1 组**刻意让"坏"候选排名高于"好"候选**、窗口设成 1 ——
        #   正确顺序下看得见那条好候选，旧顺序下**一条都不剩**。
        #   已实测：把 lib 里那两行调回旧写法 ⇒ 7 条红；还原 ⇒ 37 条全绿。
        # ⚠ 同其余守卫：**刻意不起子进程**（本机 spawnSync 一律 EBUSY）。
        #   代价：原著 txt **不在版本库里** ⇒ 这条链没法做成跑 CLI 的门禁，
        #   入口判断不在覆盖内，靠手工跑一次（v0.189 已跑两本书，输出正常）。
        run: node test/against-text-guard.mjs

      - name: scripts/ 索引的守卫
        # v0.189 新增。索引（`scripts/README.md`）是**生成物**，`check.yml` 里已有
        # `make-scripts-index.mjs --check` 那一步对拍。但本机 `npm run gate` 一步都跑不了
        # （node 起不了子进程），所以**本地真正的防线是这条守卫**：
        # 它直接 import 生成器的纯函数，当场把渲染结果和磁盘上的文件对拍。
        # 31 条断言：逐字节一致 2 + 收录完整性 2 + 分类与 check.yml 一致 4
        #   + "不删"的说法 5 + firstLineOf 8 + collectUsage 4 + 入口卫生 6。
        # 值得单说的三条：
        #   · **逐字节相等** —— 加了脚本却忘了重新生成 ⇒ 立刻红（并打印第一处不同的行号）；
        #   · **收录完整性**（`scripts/` 与 `scripts/lib/` 下一个都不许漏）——
        #     防的是"生成器自己漏了一整类文件"那种漂法，它不会让上面那条红；
        #   · **分类判据 == check.yml 的 run 集合，不多不少** ——
        #     防"门禁加了脚本、索引还按老判据分类"。
        # ⚠ 同其余守卫：**刻意不起子进程**（本机 spawnSync 一律 EBUSY）。
        #   代价：`--check` 的 CLI 分支不在覆盖内，靠手工跑一次
        #   （v0.189 已跑：故意改一行 README ⇒ 报"第一处不同在第 N 行"并 exit 1）。
        run: node test/scripts-index-guard.mjs

      - name: 三国碎片判据的有效性自测（它必须能红）
        # v0.204 新增。`audit-3k-fragments.mjs` 的四条判据（地名 / 去尾字 / 前截 / 虚词尾）
        # 全部**只做减法**，把「碎片」这个印象变成了可重跑的机械口径。
        # ⚠ 但它**不下结论说剩下的是不是人** —— v0.201–v0.203 已三次证明没有可靠机械判据。
        # 判据本身写错时，它会「见谁都判成碎片」或「见谁都放行」，而这两种错都表现为**全绿**。
        # ⇒ 用 --selftest 跑**造出来的**好样本 + 反向的真名样本（`姜维`/`张嶷`/`马超` 绝不能被误判掉）。
        # 已实测：把四条判据逐条弄坏（去掉其中一条 / 清空虚词表），自测**全部报红**。
        run: node scripts/audit-3k-fragments.mjs --selftest

      - name: scripts/ 归档卫生的守卫
        # v0.195 新增。立项实测：`scripts/*.mjs` 共 99 个（不含 archive/lib），
        #   其中一次性补丁 44 个（fix-* 40 + add-* 4）；`scripts/archive/` 里**已经躺着 8 个**
        #   —— 说明"归档"这件事做过，但**没做成规范**，于是又攒回 44 个。
        # 根因很具体：**没有任何东西在守它**。`make-scripts-index.mjs` 只是记账，不是约束。
        # 四条判据：
        #   · P1 顶层（不含 archive）出现一次性补丁 ⇒ 报「该归档了」
        #   · P2 archive 里的脚本必须有【已归档】标记（否则目录变成垃圾桶，事后没人知道它干嘛过）
        #   · P3 每个脚本文件头必须写明「一次性 / 长期」（分类靠猜 ⇒ 猜错就出事，
        #       v0.195 就差点把 `merge-duplicate-relations.mjs` 归档掉 ——
        #       而 validate.mjs 会建议用户跑它，归档等于删掉一个出口）
        #   · P4 双向对拍：门禁 `run:` 到的脚本必须在顶层（不许藏在 archive 里）
        # ⚠ 守卫末尾带**有效性自测**（在临时目录里造违规形态，确认每条判据真会红）。
        #   一个不能因真原因变红的守卫＝装饰品。
        # ⚠ 同其余守卫：刻意不起子进程（本机 spawnSync 一律 EBUSY）。
        run: node test/scripts-hygiene-guard.mjs

      - name: js/app.js 分区目录的守卫
        # v0.196 新增（债一 B1）。app.js 是 **6039 行、251 个顶层符号的单文件**，
        #   此前**零分区标记**（实测 `grep -c "^/\* " js/app.js` = 1，只有文件头注释），
        #   所有组织全靠函数名约定 ⇒ 定位一段逻辑只能 grep 6000 行。
        # 本轮加了顶部目录 + 60 个分区标记，但**目录天生会过期**：
        #   加函数、改名字、挪代码，表格不动就开始骗人 —— 而一个骗人的目录比没有更糟。
        # ⇒ 这条守卫让目录「要么是对的，要么是红的」，四条判据：
        #   · P1 表里每个起始符号在 app.js 里都存在（函数改名/删除 ⇒ 表失效）
        #   · P2 分区数三处一致（表 / 文件里的标记 / 生成器的 PARTS）
        #   · P3 每个标记后面紧跟的就是它该有的符号
        #   · P4 **表里不许出现行号** —— 行号会因插入标记而整体后移，必然变成假坐标
        #     （第一版就写了行号，实测插入后 L19 已经不是它声称的那个函数）
        # ⚠ 判据复用 `scripts/add-app-partitions.mjs` 的 `PARTS`，不另抄一份。
        run: node test/app-partitions-guard.mjs

      - name: js/app.js 函数长度守卫
        # v0.197 新增（债一 B2）。文件总行数守不住「函数别太长」——
        #   一个文件可以整齐地由十个 500 行函数组成。
        # 实测拆分前：app.js 276 个顶层函数里**只有 bindUI 超过 400 行**（503 行），
        #   其余最大 139 行（loadBook）⇒ 是**一个**真问题，不是三个。
        # ⚠ 更正：v0.194 体检报告里写的「buildOption 350 / applyEdgeFilter 306 /
        #   epubPage 219」**全是错的** —— 那次用「从声明行数到下一个顶层符号」的粗略算法，
        #   而箭头函数（const x = (…) => …）本身没有大括号，被算成了几百行。
        #   真实长度是 1 / 7 / 9 行。本守卫用**括号配平**（跳过字符串/模板/注释）重算。
        # ⚠ 这条守卫自己也踩了同一个坑两次（先是配平箭头函数、再是被模板串骗到），
        #   两次都是「算出来的长度离谱但没报错」⇒ 判据必须自己验自己。
        run: node test/app-func-size-guard.mjs

      - name: 书型术语层（TERMS）自洽与接线
        # v0.208 新增。v0.206 引入术语层（理论类把「人物/关系/事件」换成「概念/关联/案例」），
        #   v0.208 把词条从 20 个扩到 58 个、并加了「句级」模板（`TW('chHead', …)`）。
        # 为什么必须有这条守卫 —— 两类错误**都不会有任何东西报红**：
        #   ① 给 `narrative` 加了词条、忘了给 `theory` 加（或反过来）⇒ 理论类上取到 `undefined`，
        #      界面上直接印出 `undefined`；
        #   ② 句子里的措辞改回了叙事类（`'结局：'` 之类）⇒ 术语层那一句白写，界面看着完全正常。
        # 六条判据（G1–G8）：两侧词条一一对应 / 占位符集合一致 / `T().x` 与 `TW('x')` 都能解析到
        #   / 句级不许用 `T()` 取（会印出字面量 `{0}`）/ `index.html` 的 `data-term` 都能查到
        #   / 没有死词条 / 长词级值不许再作为裸字符串写死在别处。
        # ⚠ 判据本体在 `scripts/lib/type-terms.mjs`（**纯文本分析**：本机起不了子进程，
        #   也不 import `js/app.js`，它顶层就要 DOM）。
        # ⚠ 那个小词法器必须认正则字面量：`/[&<>"']/g` 这种"正则里带引号"的写法会让
        #   "遇引号就当字符串"的简易剥离器**永久失同步**（实测把整份文件的注释都当成代码）。
        # ⚠ 判"某处引用在不在"必须在**只剥注释**的那份源码上找：`${T().charN}` 全在模板字面量里，
        #   用"注释与字符串都剥掉"的那份会把它们全看成"没引用过"（实测 G7 误报 16 条）。
        run: node test/type-terms-guard.mjs

      - name: 首屏性能预算
        # v0.198 新增。本项目此前**零性能预算**：实测
        #   `grep -rn '性能预算|budget' js/ scripts/` 是零命中，
        #   而 test/browser.mjs 明明从v85 起就在测首屏耗时 ——
        #   但它拿到 window.__baPerf 之后**只 console.log、不断言**
        #   （那个文件里 perf 只出现在一行日志里）。
        # ⇒ 首屏从 0.8 秒劣化到 3 秒，门禁全绿。
        #   「量了但不管」的指标等于没量：CI 日志没人看。
        #
        # 判定用「相对基线的倍数」而不是绝对毫秒 —— 机器快慢差好几倍
        #（CI 的 ubuntu runner vs 本机 Windows），写死毫秒数换台机器就全红。
        # >1.5× 只提示、>2.5× 报红；实测同机抖动约 ±5%，所以这个分界不虚。
        #
        # ⚠ 每本书记得清 Cache Storage + Service Worker
        #   （第一版没清，三国量到 86.6 KB、另两本量到 **0.0 KB**
        #    —— sw.js 对 /data/ 走 stale-while-revalidate，第二本直接命中缓存、
        #    一个字节都没下载 ⇒ 量的是「缓存命中」不是「首屏」，假绿）。
        run: node test/perf-budget.mjs

      - name: Temp 临时目录前缀白名单的守卫
        # v0.192 新增。起因：2026-10-11 用户报「C 盘又变红了」。查下来 `%TEMP%` 里堆着
        #   **224 个** `ba-*-<6位随机>` 目录、合计 **14.56 GB**，全是本项目浏览器测试的 profile。
        #   根因**不是**回收逻辑坏了，而是**白名单漂了**：`test/_profile-guard.mjs` 里那份
        #   `PROFILE_PREFIXES` 是手写的，后来新增的 `gen-fill` / `band-labels` / `annotations` /
        #   `fullscreen` / `browser-locator` 各自 `mkdtempSync` 的前缀**从没被补进去** ⇒
        #   `sweepStaleProfiles()` 一次都没回收过它们（`ba-fill-` 62 个 / 7.76 GB 等）。
        #   ⚠ 那个文件的注释早就写着「新增脚本时把前缀加进来」——**但没有任何东西在守这句话**。
        # 本轮：把表搬到 `scripts/lib/profile-prefixes.mjs`（唯一来源），并加这条守卫，扫全仓
        #   `mkdtempSync(…os.tmpdir()…, '<前缀>')` 与这份表**双向**对拍：
        #   · 抓到的前缀必须被某条表项覆盖（否则**新脚本又漏了** = 这次 14.56 GB 的成因）；
        #   · 每条表项必须覆盖到某个抓到的前缀（否则是**打字错误或脚本已删**，表项永远不生效）。
        # 28 条断言：P1 扫描器没坏 + P2 正向 + P3 反向 + P4 形状/去重
        #   + P5 语义（**不认 `ba-books`**）+ P5b 第二张表 `msedge_*`/`scoped_dir*`（两张表互斥）
        #   + P6 两张表各只有一份定义 + P7 消费方真 import 了 + P8 两道安全闸还在。
        # ⚠ 第二张表的由来：`msedge_*`（组件解包残留）1355 个 / 5.18 GB、`scoped_dir*`
        #   （扩展安装残留）74 个 / 2.14 GB —— 同样是本项目测试**强杀 Edge** 造成的
        #   （Chromium 只在优雅退出时自清它们）。sweep 里它有**自己那道** 24 小时闸。
        # ⚠ 有效性已实测：往 `test/` 里丢一个用 `ba-zzz-` 开目录的探针 ⇒ P2 立刻报
        #   「漏了 ba-zzz-」；同一个探针再声明一次 `PROFILE_PREFIXES = [` ⇒ P6 报"还有第二处"。
        #   删掉探针 ⇒ 19 条全绿。（一个不能因真原因变红的守卫 = 装饰品。）
        # ⚠ 同其余守卫：**刻意不起子进程**（本机 spawnSync 一律 EBUSY）。
        run: node test/profile-prefix-guard.mjs

      - name: 守卫卫生（`test/*-guard.mjs` 自己那一族的类级不变量）
        # v0.180 新增。起因：v0.177/178/179 连着三轮把守卫从「起子进程看退出码」
        #   改成「直接 import 判据函数」，理由是**本机 node 起不了任何子进程**
        #   （实测 `spawnSync('git'|'node'|process.execPath, …)` 一律
        #    `status === null, error.code === 'EBUSY'`）⇒ `null === 0` 与 `null === 1`
        #   全为假 ⇒ 那批守卫在本机**每条用例都红**（`✗ 14 条不符合预期`…），一条都没测到。
        #   本轮把最后 5 个也改完（name-form / altnames / kin-terms-exempt / missing-ok /
        #   surname-coverage，共 78 条断言本机首次真跑），并把结论钉成不变量：
        #   H1 守卫不得起子进程（**先剥注释** —— 守卫文件头本来就在讲"别用 spawnSync"，
        #      不剥会被自己的注释绊倒，本轮当场踩过一次）；
        #   H2/H3 守卫必须 import `../scripts/…` 且那个脚本必须**导出函数**；
        #   H4 check 脚本的入口判断必须是 `import.meta.url === pathToFileURL(…)`，
        #      不得写成 `endsWith(process.argv[1])`（目录名带空格 ⇒ 恒不相等 ⇒ 主流程一次都不跑）；
        #   H5 入口块必须①调自己导出的函数②`process.exit(1)`（只打印不报红 = 假门禁）；
        #   H6/H7 每个守卫、每个 `scripts/check-*.mjs` 都必须登记进本 yml（**剥注释后**匹配）。
        # ⚠ 豁免 2 个，理由会**打印出来**（不打印"跳过了什么"就等于装饰品）：
        #   `_profile-guard.mjs` 是辅助库不是用例入口；`version-bump-guard.mjs` 要
        #   `git init/commit` ⇒ 本质上必须有子进程。
        # ⚠ 有效性已实测：在隔离副本里注入三处破坏（守卫加 child_process / 入口改 endsWith /
        #   从 yml 删登记），恰好 3 条红、且每条都指对了文件。
        run: node test/guard-hygiene.mjs

      - name: 亲子边的性别自洽（type 与 gender 必须对得上）
        # 这是**硬门禁**，与上面两个只读审计不同。
        # 起因 v0.108：靠它抓出 4 条 —— 3 条亲子边方向反了
        # （王经母 / 董太后 / 普尔赫莉雅都被填成了儿子），1 条性别填错（曹节）。
        # 而 audit-kin-direction 抓不到那 3 条：它只查**代号递增**，
        # 父子**同代**的方向错误它看不见。
        # 判据可靠：type 的四个值已经把父母性别写死（父子/父女/母子/母女），
        # gender 是独立标注的，对不上就是错 —— 不需要回原文。
        run: node scripts/audit-kin-gender.mjs

      - name: 搜索命中率审计（别名覆盖 / 译名变体 / 疑似漏人 / 同名）
        run: node scripts/audit-search.mjs --all

      - name: 小程序数据包与 data/*.json 同步（语义比对）
        # 不做"重新生成 + git diff"：布局里有 locale 依赖的排序，Windows 与
        # Ubuntu 生成的字节必然不同，字节比对会天天误报。改为解析两边深比较。
        run: node scripts/check-packs-sync.mjs

      - name: 小程序页面逻辑冒烟（不需要微信开发者工具）
        run: node miniprogram/test/smoke.mjs
