        # ⚠ 这条守卫**刻意不起子进程**：本机 node 起不了任何子进程（spawnSync 一律 EBUSY），
        #   而 `test/*-guard.mjs` 里那套 spawnSync 写法在本机**每条用例都红**、等于没测。
        #   这里改用导出的 `checkCrossChapterLedger(root)`，在进程内跑 —— 14 条「期望报红」
        #   场景 + 1 条 JSON 坏 + 2 条正常态 + 1 条反向（不跨章的条目才该报 L8）。
        #   代价：**入口判断**不在这条守卫里，靠手工跑一次脚本确认（v0.177 已跑：exit 0）。
