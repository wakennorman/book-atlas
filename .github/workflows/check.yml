name: 数据体检（发布门禁）

# 目的：让"数据坏了 / 小程序包没同步 / 代码语法错"在 PR 阶段就被拦住，
# 而不是等发布之后才在页面上发现。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: JS 语法检查
        run: |
          for f in js/app.js js/editor.js \
                   miniprogram/utils/graph.js miniprogram/utils/render.js miniprogram/utils/card.js \
                   miniprogram/pages/index/index.js miniprogram/app.js \
                   shared/graph-core.js scripts/bump-version.mjs scripts/check-version.mjs \
                   scripts/make-slim-packs.mjs scripts/check-sw-precache.mjs \
                   test/smoke.mjs test/core.mjs test/e2e.mjs test/browser.mjs test/parity.mjs test/editor.mjs \
                   test/races.mjs test/relax.mjs test/relations.mjs test/lock.mjs \
                   miniprogram/test/smoke.mjs sw.js eslint.config.js; do
            node --check "$f"
          done

      - name: 版本号一致性
        # v85：以前 v0.69–v0.71 连着三轮改前端却漏 bump CACHE（CHANGELOG 有记录），
        # 没有任何检查能发现。这里比对 sw.js / index.html / editor.html / js/editor.js / package.json。
        run: node scripts/check-version.mjs

      - name: 拆分数据包与 data/*.json 同步
        # v85 新增。首屏只下 <slug>.graph.json，文案在空闲时后台预取。
        # 改了 data/*.json 忘了重跑生成脚本 ⇒ 首屏会拿到过期（甚至缺文案）的数据。
        # 这一步同时校验"两份合起来 == 源文件"，剧透判定依赖的字段少一个都会失败。
        run: node scripts/make-slim-packs.mjs --check

      - name: sw.js 预缓存清单与 books.json 一致
        # 网站会持续加书，而 sw.js 的 SHELL 里是硬编码每个图包的路径。
        # 忘了加不会白屏（/data/ 走 stale-while-revalidate），但会静默不一致。
        run: node scripts/check-sw-precache.mjs

      - name: ESLint 代码检查
        # v85：原先结尾是 `|| true`，而 ESLint 9 已不认 .eslintrc.json —— 这一步一直在崩溃，
        # 又被 || true 吞掉，门禁是"假绿"的。现在改用 eslint.config.js，并且不再吞错误。
        run: npx eslint js/ miniprogram/utils/ miniprogram/pages/ scripts/ shared/ test/ --ext .js,.mjs

      - name: 网页版核心逻辑冒烟测试
        run: node test/smoke.mjs

      - name: 共享核心逻辑单元测试
        run: node test/core.mjs

      - name: Web E2E 冒烟测试
        run: node test/e2e.mjs

      - name: 浏览器行为测试（无头 Edge 真点一遍）
        # v85 新增。node 冒烟测不到"委托写错了但没抛错"这类问题 ——
        # 右栏/时间轴的按钮从逐元素 listener 改成 document 级委托后，必须真在浏览器里点一遍。
        # 脚本找不到 Edge/Chrome 时会自行跳过（不阻塞其它检查）。
        run: node test/browser.mjs

      - name: 编辑器逻辑测试（无头 Edge）
        # v85 新增。js/editor.js 有 1700 行，此前零覆盖；里面 parseLooseJson（修模型返回的
        # 截断 JSON，整本生成的成败全靠它）、hanToNum/splitChapters（切章节）这些纯逻辑
        # 坏了的表现是"某一章老是失败"，不是任何明显报错，只能靠断言守住。
        run: node test/editor.mjs

      - name: 三份实现对拍（app.js / graph-core / 小程序）
        # v85 新增。同一套过滤逻辑在三处手抄，已经漂移过一次：分组口径只改了 app.js，
        # 小程序至今按最终阵营分组（三国里"此刻还在群雄"的 11 人被画进"曹魏"组），
        # 而 test/core.mjs 只测 graph-core 且只断言 typeof，一直看不出来。
        run: node test/parity.mjs

      - name: 竞态与导出守卫（无头 Edge，人为制造交错返回）
        # v86 新增。三类只有"真在浏览器里按快一点"才会暴露的问题：
        #   ① 快速切书时 loadBook 没有过期响应守卫 ⇒ 三国的响应后到，把下拉框里
        #      已经选好的百年孤独顶掉（state.book 与下拉框不一致，图也是错的）
        #   ② 前一本书的文案包拉取失败 ⇒ 旧的全局 state.textLoaded='failed' 是 truthy，
        #      把**下一本**的文案永久挡掉，整本书描述空白且无任何提示
        #   ③ 文案还没到就点「导出 JSON」⇒ 导出的是被剥掉全部散文的文件，
        #      而 README 正是让贡献者把它提交回 data/ 的 ⇒ 散文永久丢失
        # 自带的服务器会给三国图包加 800ms 延迟、让别的文案包返回 500 来制造条件。
        run: node test/races.mjs

      - name: 落位与防重叠（无头 Edge，三国 871 人）
        # v87 新增。守住一个真实 bug：零关系人物（三国有 35 个）被 fillMissingPositions
        # 全部放到同一个重心 ⇒ 35 个节点叠成一个点，而 relaxPositions 对"坐标完全相同"
        # 的那一对无能为力（dx=dy=0，位移永远是 0），所以永远分不开。
        # 同时守住「喂进 871 个完全重合的坐标也不会产生 NaN」这条兜底。
        run: node test/relax.mjs

      - name: 关系线身份（无头 Edge，1545 条线逐条对账）
        # v88 新增。守住一个真实 bug：同一对人物之间可能有**类型完全相同**的多条关系
        # （刘备—诸葛亮有两条「君臣军师」，第40章与第49章），图上画成两条不同曲率的线，
        # 但只靠 (source, target, 类型) 分不开 ⇒ 悬停/点第二条会解析成第一条，
        # 用户看到的是"这条线点了没反应"（其实有反应，只是响应的是旁边那条线）。
        # 三国共 14 处这种歧义。
        run: node test/relations.mjs

      - name: 锁定只显示相关（无头 Edge，三国 871 人）
        # v89 新增。锁定（搜索单个人物 / 两人关系）时图上只画锁定集合内的点与线。
        # 起因：原先集合外的元素只是 opacity 调低继续画着，也没有 silent，
        # 而 zrender 的命中测试不看 opacity —— 后画的淡线吃掉鼠标事件，
        # 用户瞄准一条亮线却点不动（实测"大多数线点不动、偶尔能点"）。
        # 同时守住跳数控件与「解除后完整还原 + 坐标逐位还原」。
        run: node test/lock.mjs

      - name: 数据校验（结构 / 引用 / 亲属 / 别名 / 时间区间）
        run: node scripts/validate.mjs --all

      - name: 搜索命中率审计（别名覆盖 / 译名变体 / 疑似漏人 / 同名）
        run: node scripts/audit-search.mjs --all

      - name: 小程序数据包与 data/*.json 同步（语义比对）
        # 不做"重新生成 + git diff"：布局里有 locale 依赖的排序，Windows 与
        # Ubuntu 生成的字节必然不同，字节比对会天天误报。改为解析两边深比较。
        run: node scripts/check-packs-sync.mjs

      - name: 小程序页面逻辑冒烟（不需要微信开发者工具）
        run: node miniprogram/test/smoke.mjs
