        run: node test/prose-bold-guard.mjs

      - name: 简→繁转换表守卫（H1 漏字 / H2 死条目 / H3 歧义 / D1 幂等 / D2 单一收口）
        # v0.219 新增。繁体版**不是翻译**，是查两张表的文本转换（不换词：網絡仍是網絡）。
        # 表在 `data/s2t.json`（提交的人工资产：1,240 字 + 1,239 词组 + 2,284 同形字），
        # 人工覆盖在 `scripts/lib/s2t-overrides.mjs`，重生成器是 `scripts/make-s2t-dict.mjs`
        # （只在改词表时手工跑，CI 不跑、也不依赖 opencc-js）。
        # 这条门禁守四件会静默出错的事：
        #   H1 语料里每个汉字都要有交代（在 chars 转 / 在 same 属繁简同形 / 已是繁体）——
        #      漏一个就是「繁中模式下某个生僻字悄悄还是简体」；
