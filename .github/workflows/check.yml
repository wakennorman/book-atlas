        run: node test/s2t-guard.mjs

      - name: 跨章声明台账（A3 的 11 处已回原著核过）
        # v0.177 新增。`data/cross-chapter-ok.json` 是 `audit-annotations.mjs` 的 A3
        # （条目 events[] 里声明了「章号 ≠ 本条 ch」的事件）的**已核台账**。
        # 那 11 处已回原著逐条核过（结论：ch 没有一处写错，全部是有意跨章 ——
        # 大多是"拿上一回的事件作对照/收束"，其中 e-61-1 / e-88-1 **只被这一个条目声明**，
        # 不挂反而成孤儿）。台账按 **(book, ch, event)** 记账，三样都会变 ⇒ 必须守：
        #   L1 数组 / L2 形状 / L3 why ≥8 字 / L4 书存在 / L5 该章有条目 / L6 事件存在 /
        #   L7 该章**有**条目声明它（否则消费方永远读不到 = 死条目）/
        #   L8 事件章号**确实 ≠** 台账 ch（否则它已不是跨章 ⇒ 台账过期自相矛盾）/
        #   L9 去重 / **L10 双向：数据里实际的跨章声明每一条都要在台账里**（未核的报出来）。
        # ⚠ L10 与审计脚本共用 `scripts/lib/anno-cross-chapter.mjs` 的同一份定义（不抄第二遍）。
        run: node scripts/check-cross-chapter-ledger.mjs

      - name: 跨章声明台账检查自身的守卫（证明它真的会报红）
        # v0.177 新增。上一步是"防一份台账悄悄失效"的检查，所以必须有一条测试
