      - name: 浏览器行为测试（无头 Edge 真点一遍）
        # v85 新增。node 冒烟测不到"委托写错了但没抛错"这类问题 ——
        # 右栏/时间轴的按钮从逐元素 listener 改成 document 级委托后，必须真在浏览器里点一遍。
        # 脚本找不到 Edge/Chrome 时会自行跳过（不阻塞其它检查）。
