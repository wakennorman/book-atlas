        # 台账（*-ok.json）与生成物（.graph/.text.json）明确不扫，理由见 lib 头。
        run: node scripts/check-ui-notes.mjs

      - name: 「内部措辞不进 UI」检查自身的守卫（证明它真的会报红）
        # v0.213 新增。一条「防泄漏」的门禁自己必须证明会 exit 1 —— 并且**不会乱报**：
        # `solid＝支撑派生` 含 `id＝` 子串、annotations body 里的 `（e-1-1）` 行内引用
