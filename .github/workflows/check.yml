        run: node test/ui-notes-guard.mjs

      - name: 散文 `**` 的渲染守卫（escBold / unbold / 小程序纯文本）
        # v0.218 新增。实测：`characters[].note` / `events[].impact` / `events[].summary` /
        # `characters[].desc` 里共 272 个 `**`＝136 段成对粗体，全部走 `esc()` 直出 ⇒
