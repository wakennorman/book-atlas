name: 数据体检（发布门禁）

# 目的：让"数据坏了 / 小程序包没同步 / 代码语法错"在 PR 阶段就被拦住，
# 而不是等发布之后才在页面上发现。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # v0.146：`check-version-bump.mjs` 要靠 git 历史找「最后一次 bump CACHE 的提交」，
          # 默认的 fetch-depth=1 浅克隆会让它拿不到 base ⇒ 只能打印「跳过」。
          # 其它依赖 blame/log 的检查（如引文审计）同理受益。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: JS 语法检查
        run: |
          for f in js/app.js js/editor.js \
                   miniprogram/utils/graph.js miniprogram/utils/render.js miniprogram/utils/card.js \
                   miniprogram/pages/index/index.js miniprogram/app.js \
                   shared/graph-core.js scripts/bump-version.mjs scripts/check-version.mjs \
                   scripts/check-version-bump.mjs scripts/make-slim-packs.mjs scripts/check-sw-precache.mjs \
                   test/smoke.mjs test/core.mjs test/e2e.mjs test/browser.mjs test/parity.mjs test/editor.mjs \
                   test/races.mjs test/relax.mjs test/relations.mjs test/lock.mjs test/render-scale.mjs test/roam.mjs \
                   test/canvas-hint.mjs test/version-bump-guard.mjs test/kin-constants.mjs test/kin-check.mjs test/parent-child.mjs \
                   miniprogram/test/smoke.mjs sw.js eslint.config.js; do
            node --check "$f"
          done

      - name: 版本号一致性
        # v85：以前 v0.69–v0.71 连着三轮改前端却漏 bump CACHE（CHANGELOG 有记录），
        # 没有任何检查能发现。这里比对 sw.js / index.html / editor.html / js/editor.js / package.json。
        run: node scripts/check-version.mjs

      - name: 改了前端资源必须 bump 版本号
        # v0.146 新增。上一步 `check-version.mjs` 只查**一致性**（各处 ?v=NN 与 CACHE 是否彼此相等），
        # 查不出「该 bump 而没 bump」—— 全都没动也是一致的，检查照样通过。
        # 实测踩过：js/ 从 v0.131 到 v0.142 **至少 9 轮**改过前端，CACHE 却一直是 bookatlas-v99
        # ⇒ 老访客一直跑 v99 的代码。这正是 v85 出过、check-version.mjs 当初要防的那件事，换了个入口复发。
        # 判据（只用 git，不靠猜）：base = 最后一次改动 CACHE 的提交；
        # 若 base..HEAD 之间 index.html/editor.html/js//css//shared/ 变过 ⇒ 就是忘了 bump ⇒ exit 1。
        # 拿不到 git 历史（浅克隆等）⇒ 打印「跳过」exit 0（门禁里一条会误报的检查终会被 || true 吞掉）。
        run: node scripts/check-version-bump.mjs

      - name: 版本 bump 检查自身的守卫（证明它会报红）
        # v0.146 新增。上面那条检查本身就是为了防「判据存在但从不触发」，
        # 所以必须有一条测试**证明它真的会 exit 1** —— 否则它可能随时悄悄退化成空转
        # （自测时就踩过：`-G 'bookatlas-v\d'` 里的 `\d` 被 git 当字面 d ⇒ 永远找不到 base ⇒ 永远跳过）。
        # 做法：在临时目录 git init 一个最小仓库，把 BOOKATLAS_ROOT 指过去，逐场景断言退出码。不碰真实仓库。
        run: node test/version-bump-guard.mjs

      - name: 拆分数据包与 data/*.json 同步
        # v85 新增。首屏只下 <slug>.graph.json，文案在空闲时后台预取。
        # 改了 data/*.json 忘了重跑生成脚本 ⇒ 首屏会拿到过期（甚至缺文案）的数据。
        # 这一步同时校验"两份合起来 == 源文件"，剧透判定依赖的字段少一个都会失败。
        run: node scripts/make-slim-packs.mjs --check

      - name: graph/text 包的人物字段覆盖
        # v0.97 新增。`make-slim-packs.mjs --check` 只能发现"忘了重新生成"，
        # 发现不了"**生成脚本的白名单里漏了这个字段**"。
        # 实测踩过：`altNames`（又译）从 v0.95 接进前端、v0.97 填了 27 条真实译名，
        # 却因为白名单漏了它 ⇒ 网页端两个包里都没有它 ⇒ 浏览器里「又译」一条都不显示，
        # 而门禁全绿（前端那几条断言用的是运行时注入的探针 altName，绕过了数据通路）。
        # 判据是「源数据里有值、而 graph.json 与 text.json 里都没有」。
        run: node scripts/check-graph-fields.mjs

      - name: 拆书素材文档与 data/*.json 同步
        # v0.145 新增。`scripts/make-anno-digest.mjs` 的文件头一直写着「--check 进 CI」，
        # 但 check.yml 里从来没有这一步 —— 于是它**没进 CI**。
        # 后果实测过：改完 data/three-kingdoms.json 忘了重跑生成脚本，
        # `docs/拆书素材-*.md` 六份全过期（e-33-1 的在场人物与数据对不上），
        # 而门禁 31 步全绿。这正是本项目反复踩的「改了等于没改」。
        # 判据：文档逐字由 data 重排而来 ⇒ 与数据必须逐字节一致（可复现、可 diff）。
        run: node scripts/make-anno-digest.mjs --check

      - name: 拆书标注校验（引用的 id 必须真实存在）
        # v0.145 新增。拆书条目是**唯一一块"由人/模型写、却当成事实展示"**的内容，
        # 风险最高，而此前没有任何门禁守它。
        # 卡死的四条：① events/chars 里的 id 必须真实存在于该书数据（防编造主闸门）
        #            ② ch 必须落在该书章号范围内
        #            ③ basis 必填（区分"原文"与"整理者推断"）
        #            ④ body/title 不得为空、不得是「待补/TODO」这类占位
        # 这是**硬门禁**（有问题即 exit 1），不是只读审计。
        run: node scripts/check-annotations.mjs

      - name: sw.js 预缓存清单与 books.json 一致
        # 网站会持续加书，而 sw.js 的 SHELL 里是硬编码每个图包的路径。
        # 忘了加不会白屏（/data/ 走 stale-while-revalidate），但会静默不一致。
        run: node scripts/check-sw-precache.mjs

      - name: ESLint 代码检查
        # v85：原先结尾是 `|| true`，而 ESLint 9 已不认 .eslintrc.json —— 这一步一直在崩溃，
        # 又被 || true 吞掉，门禁是"假绿"的。现在改用 eslint.config.js，并且不再吞错误。
        run: npx eslint js/ miniprogram/utils/ miniprogram/pages/ scripts/ shared/ test/ --ext .js,.mjs

      - name: 网页版核心逻辑冒烟测试
        run: node test/smoke.mjs

      - name: 共享核心逻辑单元测试
        run: node test/core.mjs

      - name: Web E2E 冒烟测试
        run: node test/e2e.mjs

      - name: 浏览器行为测试（无头 Edge 真点一遍）
        # v85 新增。node 冒烟测不到"委托写错了但没抛错"这类问题 ——
        # 右栏/时间轴的按钮从逐元素 listener 改成 document 级委托后，必须真在浏览器里点一遍。
        # 脚本找不到 Edge/Chrome 时会自行跳过（不阻塞其它检查）。
        run: node test/browser.mjs

      - name: 编辑器逻辑测试（无头 Edge）
        # v85 新增。js/editor.js 有 1700 行，此前零覆盖；里面 parseLooseJson（修模型返回的
        # 截断 JSON，整本生成的成败全靠它）、hanToNum/splitChapters（切章节）这些纯逻辑
        # 坏了的表现是"某一章老是失败"，不是任何明显报错，只能靠断言守住。
        run: node test/editor.mjs

      - name: 三份实现对拍（app.js / graph-core / 小程序）
        # v85 新增。同一套过滤逻辑在三处手抄，已经漂移过一次：分组口径只改了 app.js，
        # 小程序至今按最终阵营分组（三国里"此刻还在群雄"的 11 人被画进"曹魏"组），
        # 而 test/core.mjs 只测 graph-core 且只断言 typeof，一直看不出来。
        run: node test/parity.mjs

      - name: 竞态与导出守卫（无头 Edge，人为制造交错返回）
        # v86 新增。三类只有"真在浏览器里按快一点"才会暴露的问题：
        #   ① 快速切书时 loadBook 没有过期响应守卫 ⇒ 三国的响应后到，把下拉框里
        #      已经选好的百年孤独顶掉（state.book 与下拉框不一致，图也是错的）
        #   ② 前一本书的文案包拉取失败 ⇒ 旧的全局 state.textLoaded='failed' 是 truthy，
        #      把**下一本**的文案永久挡掉，整本书描述空白且无任何提示
        #   ③ 文案还没到就点「导出 JSON」⇒ 导出的是被剥掉全部散文的文件，
        #      而 README 正是让贡献者把它提交回 data/ 的 ⇒ 散文永久丢失
        # 自带的服务器会给三国图包加 800ms 延迟、让别的文案包返回 500 来制造条件。
        run: node test/races.mjs

      - name: 落位与防重叠（无头 Edge，三国 871 人）
        # v87 新增。守住一个真实 bug：零关系人物（三国有 35 个）被 fillMissingPositions
        # 全部放到同一个重心 ⇒ 35 个节点叠成一个点，而 relaxPositions 对"坐标完全相同"
        # 的那一对无能为力（dx=dy=0，位移永远是 0），所以永远分不开。
        # 同时守住「喂进 871 个完全重合的坐标也不会产生 NaN」这条兜底。
        run: node test/relax.mjs

      - name: 关系线身份（无头 Edge，1545 条线逐条对账）
        # v88 新增。守住一个真实 bug：同一对人物之间可能有**类型完全相同**的多条关系
        # （刘备—诸葛亮有两条「君臣军师」，第40章与第49章），图上画成两条不同曲率的线，
        # 但只靠 (source, target, 类型) 分不开 ⇒ 悬停/点第二条会解析成第一条，
        # 用户看到的是"这条线点了没反应"（其实有反应，只是响应的是旁边那条线）。
        # 三国共 14 处这种歧义。
        run: node test/relations.mjs

      - name: 锁定只显示相关（无头 Edge，三国 871 人）
        # v89 新增。锁定（搜索单个人物 / 两人关系）时图上只画锁定集合内的点与线。
        # 起因：原先集合外的元素只是 opacity 调低继续画着，也没有 silent，
        # 而 zrender 的命中测试不看 opacity —— 后画的淡线吃掉鼠标事件，
        # 用户瞄准一条亮线却点不动（实测"大多数线点不动、偶尔能点"）。
        # 同时守住跳数控件与「解除后完整还原 + 坐标逐位还原」。
        run: node test/lock.mjs

      - name: 渲染尺度与「分组·横」布局（无头 Edge）
        # v90 新增。守住一个真实 bug：ECharts 的 graph 系列**不会**把世界坐标 1:1 画到像素上，
        # 它先把数据包围盒**等比**塞进「容器居中 80%」，再把 zoom 乘在那个适配系数之上。
        # 于是 fitPositions 里的缩放系数对渲染毫无影响（只有长宽比有意义），而
        # 「分组·横」的长宽比是 1:5.8（曹魏 250 人排一根 12500 长的竖线、群组轴才 2160），
        # 对上 2:1 的画布 ⇒ 群组轴被压到 **83px 宽**、十个阵营图注全叠在一起；
        # 再叠上"拿 zoom 当像素尺度"的 focusViewOn，点谁就把视野怼到空处 ⇒ 一片空白，
        # 只有重置才回得来。这一步量的是 zrender 里的**真实墨迹**，不是我们自己算的数。
        run: node test/render-scale.mjs

      - name: 画布漫游与视野自救（无头 Edge，真实拖动/滚轮事件）
        # v90 新增。守住用户报的两个现象：
        #   ① graphroam 事件**只同步了 zoom、从不同步 viewCenter**。而两类事件载荷各带一半 ——
        #      拖动是 {dx,dy}（没有 zoom）、滚轮是 {zoom,originX,originY}（没有位移），
        #      于是用户把画布拖到别处之后 viewCenter 永远停在 [0,0]，而 focusViewOn 判断
        #      "高亮有没有跑出视野"用的正是这个陈旧中心 ⇒ 永远算出"没跑出去" ⇒ 一点不动，
        #      只能靠「重置」或双击救回来（用户："画布跑到右侧了，碰运气滑动多次才看到"）。
        #   ② focusViewOn 的目标倍率只按高亮包围盒算，只有一两个人时包围盒被兜成 1 ⇒ 顶到 4 倍
        #      ⇒ 连点几次可见率从 77% 掉到 1.8%（zoom 一路爬到 7.84）。
        # 这一步用 **zrender 的 handler 合成真实 mousedown/mousemove/mouseup/mousewheel**
        # （CDP 的 Input.dispatchMouseEvent 在无头 Edge 里到不了页面），判据一律量 zrender 里的真实墨迹。
        run: node test/roam.mjs

      # ↓↓↓ v0.145 补进 CI 的 4 个测试 ↓↓↓
      # 起因：`package.json` 的 `check` 脚本里**早就列了**这 4 个测试，但 `check.yml` 里没有
      # ⇒ 「本地 `npm run check`」与「CI 门禁」是**两份会漂移的定义**，而 README 明说
      # `npm run gate` 跑的是「按 check.yml 完全一样的门禁」。这四个测试实测全绿（约 3.2 分钟），
      # 只是从未被 CI 守过 —— 典型的「门禁只守了 1/N」。
      - name: 全屏展示（无头 Edge）
        run: node test/fullscreen.mjs

      - name: 分组图注可读性（无头 Edge）
        run: node test/band-labels.mjs

      - name: 分组视图占满画布（无头 Edge）
        run: node test/gen-fill.mjs

      - name: 拆书标注（无头 Edge）
        run: node test/annotations.mjs

      - name: 画布手感与导航提示（无头 Edge）
        # v91 新增。用户反馈两件事：
        #   ① "只有鼠标点击到关系图的部分才能拖回来，点击关系图之外的空白画布就拖不回来"
        #      —— 这是漫游只绑在 ECharts 那块画布上的正常结果（工具条/两人关系/事件轴/右栏
        #      各有自己的滚动与交互，被拖动劫持反而更糟；Figma/Google Maps 之所以能"任意处拖"
        #      是因为画布独占整个视口，那是另一种形态）。所以不加宽漫游区域，改为把
        #      「能拖的那块」明确说出来：grab/grabbing 光标 + touch-action:none + 图下常驻提示
        #      + 把原来那句含糊的"空白处拖动"全部改成"在图上…／双击图的空白"。
        #   ② 点关系线时"会继续导航重大事件轴"的那种，停留时间还是太快（它是第二步，
        #      比右栏晚 550ms，1.8s 根本来不及）⇒ 事件卡闪烁加长到 3.9s。
        run: node test/canvas-hint.mjs

      - name: 布局可复现 + 视野记忆（无头 Edge）
        # v93 新增。「自由」视图改用固定种子 + 固定轮数的确定性力导向之后，
        # 三种视图的坐标必须在两次独立冷启动之间**逐位相同**（871 个坐标实测全等）；
        # 同时每本书的视野（zoom + center）要记住，且首屏稳定期那个迟到的 resize
        # 不能把它抹掉（pendingView 有 3 秒有效期）。
        run: node test/layout-stable.mjs

      - name: 地点介绍（combobox + 无障碍浮层）
        # v93 新增。原生 <select> 的 <option> 由操作系统绘制 ⇒ 挂不上 tooltip，
        # 所以筛选下拉换成项目自己的 combo（说明跟当前行走，WCAG 的 combobox 模式），
        # 页面别处的地点名走 WCAG 2.1 SC 1.4.13 的悬停/聚焦浮层。
        run: node test/place.mjs

      - name: AI 讲解多轮追问
        # v93 新增。拦 `window.fetch` 看**真正发出去的 messages**：
        # system 要每轮重发、追问要带上历史、失败的提问要回滚。
        run: node test/ai.mjs

      - name: 点开地点后画布不能空白（无头 Edge）
        # v94 新增。用户报"按地点筛选点开之后关系画布是空白的"。
        # 病根：world→像素 的换算一直用 fitPositions 的**解析式**，而那个式子是按
        # **全图**包围盒推的；ECharts 的 View 坐标系适配的却是**当前绘制集合** ——
        # 筛选到少数节点后真实比例从 1.064 跳到 3.983，解析式仍给 1.064（差 3.74 倍），
        # 于是 focusViewOn 里"人在不在画面里"和"放大能不能救"两个判断同时反掉。
        # 两步门禁：① 比例实测对拍（用 convertToPixel 独立量，和 app 自己用的值比）；
        # ② 每个地点**重新加载页面**后单独点一次，数锁定的人有几个真在画布内
        #    （连点会让上一次的视野残留替这一次打掩护 —— 第一版探针就栽在这，
        #     测出 10/10 假绿，而真实单点路径是 3/10）。
        run: node test/place-visible.mjs

      - name: 构建版本水印 + 弃用模型名迁移（无头 Edge）
        # v0.94 新增。两件"用户看得见但门禁看不见"的事：
        #  ① 页脚版本号取自**实际加载到的** app.js 的 ?v=，与服务器 sw.js 不一致就提示硬刷新。
        #     本项目吃过一次"部署后老访客仍跑旧代码"的亏；断言 document.currentScript
        #     还能取到值，是防"哪天改成 module 了、水印悄悄变成'未知'"。
        #  ② localStorage 里存的 deepseek-chat（已公告弃用）迁移成 deepseek-flash；
        #     但别的模型名一律不动 —— 迁移只针对弃用清单，不擅自改人配置。
        run: node test/build.mjs

      - name: 截断文字的全文浮层（无头 Edge）
        # v0.96 新增。用户报"本章新关系""重大事件轴"里长文本显示不全，
        # 原话"那么多内容显示不出来有什么用"。做成悬停/聚焦弹全文（不是横向滚动：
        # 横着移的字读不了、复制不了，读屏也拿不到）。
        # 关键断言是**负向**那条：没被剪掉的元素不许弹 —— 否则页面会变得很吵。
        run: node test/full-tip.mjs

      - name: 数据校验（结构 / 引用 / 亲属 / 别名 / 时间区间）
        run: node scripts/validate.mjs --all

      - name: 亲属称谓计算（族谱推称谓：直系 / 同胞 / 伯叔 / 姑舅姨 / 堂表）
        run: node test/kin-terms.mjs

      - name: 亲属类型标签跨端一致性（KIN / KIN_HINT 的 5 处副本）
        # v0.149 新增。亲属类型标签（blood→血缘、inlaw→姻亲…）在项目里有 5 处副本：
        # scripts/kin.mjs 是权威；网页 js/app.js、编辑器 js/editor.js、小程序
        # miniprogram/utils/graph.js 与 miniprogram/pages/index/index.js 各抄一份 ——
        # 因为浏览器 / 小程序模块 import 不了 scripts/，项目对同类问题的既定策略是「手抄 + 对拍」。
        # 目前 5 处一致，但此前**没有任何测试守着**：某端单独改一个标签，
        # 就会出现「同一个 kin 在网页显示 A、在小程序显示 B」这种**用户可见**的不一致，而门禁全绿。
        # 判据：读各文件源码抽常量、与权威逐键比对（连「漏抄一个键」也能抓到）。
        run: node test/kin-constants.mjs

      - name: checkKin 规则金标（kin 与 type 自洽的唯一判据）
        # v0.150 新增。`checkKin` 是「亲属类型（kin）与关系名（type）是否自洽」的**唯一判据**，
        # validate.mjs 靠它报错（v0.147 收紧后「非 blood 配纯血缘称谓」是 error，
        # 正是靠它抓出「吴懿—刘璋 舅甥 + kin=inlaw」那两条）。但它此前**零测试覆盖**。
        # 钉返回的 level 序列（结构），不钉文案 —— 文案会改，语义不会。
        run: node test/kin-check.mjs

      - name: 亲子边定义跨端一致性（含「养父子」这类收养边）
        # v0.153 新增。「哪条关系算亲子边」这个定义在项目里抄了 **8 份以上**，已漂出 3 种行为：
        #   · 权威    scripts/kin-terms.mjs 的 isParentChild（含「养父子」）
        #   · 漏「养」 scripts/fix-gongsun.mjs / fix-wu-tail.mjs（一次性补丁，显式豁免）
        #   · 只认血缘 js/editor.js 的「亲子成环」检测 ⇒ 全部收养亲子边对编辑器不可见
        #              （三国 7 条、百年孤独 2 条）
        # 这不是新问题：scripts/lib/data-files.mjs 把它列为「同一个定义抄多份」的第 ① 例（v0.110），
        # 当时改了那三个审计脚本却**没加判据**，于是又漂了一次。
        # 判据：源码级（编辑器那份与权威逐字相同）+ 结构级（不许出现第 3 份 / 「缺养」变体）
        #       + 金标（钉「正确」而非「现状」）。浏览器侧的两条在 test/editor.mjs 里。
        run: node test/parent-child.mjs

      - name: 亲属称谓对质（手写 type 必须与族谱算出来的一致）
        # 起因 v0.99：用户报「上校—叔侄（伯父与侄）—奥雷里亚诺第二」
        # 说"第二代和第四代怎么可能只是叔侄"。手打的称谓字符串不可能自洽，
        # 而 derive-kin.mjs 有「已有直接关系的两个人不再推导」⇒ 错的标签
        # 还会把正确的推导边一起挡掉。本步让错标签**自己报出来**。
        # 族谱覆盖不足的书会整体跳过（那是数据没录全，不是缺陷）。
        #
        # ⚠ v0.115 追加 --coverage=0：那个 15% 是**代理指标**，
        #   当初存在的理由（族谱薄且未校验 ⇒ 容易误报）已被两个直接结构检查取代：
        #   audit-kin-direction（查父子边方向）与 audit-kin-gender（查 type/gender 自洽），
        #   两者都是硬门禁。
        #   实测三本书在 coverage=0 下**全部 0 不一致**（三国 148 / 百年孤独 54 / 罪与罚 7），
        #   所以"跳过"今天已经挡不住任何东西 —— 继续靠跳过装作没事，不如真去跑。
        #   这一步**不改门槛默认值**，只是让门禁真的检查到三国。
        run: node scripts/check-kin-terms.mjs --all --coverage=0

      - name: 关系引文的行为人审计（引文存在 ≠ 引文支持这条关系）
        # 起因 v0.101：用户抓出一条**引文真实、行为人挂错**的关系 ——
        # 把「奥雷里亚诺第二哼着好汉弗朗西斯科的歌」挂到了上校名下，
        # 而且「师徒」这个关系类型是我编的。
        # **只出报告、退出码 0**：A/B 两级实测几乎全是误报（原文用简称、
        # 用「张、戴二人」代指两个人、代词指的正是关系一方），
        # 拿它当门禁会天天误报。这份报告是给人看的，不是判决。
        run: node scripts/audit-relation-actors.mjs

      - name: 亲子边的性别自洽（type 与 gender 必须对得上）
        # 这是**硬门禁**，与上面两个只读审计不同。
        # 起因 v0.108：靠它抓出 4 条 —— 3 条亲子边方向反了
        # （王经母 / 董太后 / 普尔赫莉雅都被填成了儿子），1 条性别填错（曹节）。
        # 而 audit-kin-direction 抓不到那 3 条：它只查**代号递增**，
        # 父子**同代**的方向错误它看不见。
        # 判据可靠：type 的四个值已经把父母性别写死（父子/父女/母子/母女），
        # gender 是独立标注的，对不上就是错 —— 不需要回原文。
        run: node scripts/audit-kin-gender.mjs

      - name: 搜索命中率审计（别名覆盖 / 译名变体 / 疑似漏人 / 同名）
        run: node scripts/audit-search.mjs --all

      - name: 小程序数据包与 data/*.json 同步（语义比对）
        # 不做"重新生成 + git diff"：布局里有 locale 依赖的排序，Windows 与
        # Ubuntu 生成的字节必然不同，字节比对会天天误报。改为解析两边深比较。
        run: node scripts/check-packs-sync.mjs

      - name: 小程序页面逻辑冒烟（不需要微信开发者工具）
        run: node miniprogram/test/smoke.mjs
