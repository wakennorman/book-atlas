      - name: 分组视图占满画布（无头 Edge）
        run: node test/gen-fill.mjs

      - name: 拆书标注（无头 Edge）
        run: node test/annotations.mjs

      - name: 画布手感与导航提示（无头 Edge）
        # v91 新增。用户反馈两件事：
        #   ① "只有鼠标点击到关系图的部分才能拖回来，点击关系图之外的空白画布就拖不回来"
        #      —— 这是漫游只绑在 ECharts 那块画布上的正常结果（工具条/两人关系/事件轴/右栏
        #      各有自己的滚动与交互，被拖动劫持反而更糟；Figma/Google Maps 之所以能"任意处拖"
        #      是因为画布独占整个视口，那是另一种形态）。所以不加宽漫游区域，改为把
        #      「能拖的那块」明确说出来：grab/grabbing 光标 + touch-action:none + 图下常驻提示
        #      + 把原来那句含糊的"空白处拖动"全部改成"在图上…／双击图的空白"。
        #   ② 点关系线时"会继续导航重大事件轴"的那种，停留时间还是太快（它是第二步，
        #      比右栏晚 550ms，1.8s 根本来不及）⇒ 事件卡闪烁加长到 3.9s。
        run: node test/canvas-hint.mjs

      - name: 布局可复现 + 视野记忆（无头 Edge）
        # v93 新增。「自由」视图改用固定种子 + 固定轮数的确定性力导向之后，
        # 三种视图的坐标必须在两次独立冷启动之间**逐位相同**（871 个坐标实测全等）；
        # 同时每本书的视野（zoom + center）要记住，且首屏稳定期那个迟到的 resize
        # 不能把它抹掉（pendingView 有 3 秒有效期）。
        run: node test/layout-stable.mjs

      - name: 地点介绍（combobox + 无障碍浮层）
        # v93 新增。原生 <select> 的 <option> 由操作系统绘制 ⇒ 挂不上 tooltip，
        # 所以筛选下拉换成项目自己的 combo（说明跟当前行走，WCAG 的 combobox 模式），
        # 页面别处的地点名走 WCAG 2.1 SC 1.4.13 的悬停/聚焦浮层。
        run: node test/place.mjs

      - name: AI 讲解多轮追问
        # v93 新增。拦 `window.fetch` 看**真正发出去的 messages**：
        # system 要每轮重发、追问要带上历史、失败的提问要回滚。
        run: node test/ai.mjs

      - name: 点开地点后画布不能空白（无头 Edge）
        # v94 新增。用户报"按地点筛选点开之后关系画布是空白的"。
        # 病根：world→像素 的换算一直用 fitPositions 的**解析式**，而那个式子是按
        # **全图**包围盒推的；ECharts 的 View 坐标系适配的却是**当前绘制集合** ——
        # 筛选到少数节点后真实比例从 1.064 跳到 3.983，解析式仍给 1.064（差 3.74 倍），
        # 于是 focusViewOn 里"人在不在画面里"和"放大能不能救"两个判断同时反掉。
        # 两步门禁：① 比例实测对拍（用 convertToPixel 独立量，和 app 自己用的值比）；
        # ② 每个地点**重新加载页面**后单独点一次，数锁定的人有几个真在画布内
        #    （连点会让上一次的视野残留替这一次打掩护 —— 第一版探针就栽在这，
        #     测出 10/10 假绿，而真实单点路径是 3/10）。
        run: node test/place-visible.mjs

      - name: 构建版本水印 + 弃用模型名迁移（无头 Edge）
        # v0.94 新增。两件"用户看得见但门禁看不见"的事：
        #  ① 页脚版本号取自**实际加载到的** app.js 的 ?v=，与服务器 sw.js 不一致就提示硬刷新。
        #     本项目吃过一次"部署后老访客仍跑旧代码"的亏；断言 document.currentScript
        #     还能取到值，是防"哪天改成 module 了、水印悄悄变成'未知'"。
        #  ② localStorage 里存的 deepseek-chat（已公告弃用）迁移成 deepseek-flash；
        #     但别的模型名一律不动 —— 迁移只针对弃用清单，不擅自改人配置。
        run: node test/build.mjs

      - name: 截断文字的全文浮层（无头 Edge）
        # v0.96 新增。用户报"本章新关系""重大事件轴"里长文本显示不全，
        # 原话"那么多内容显示不出来有什么用"。做成悬停/聚焦弹全文（不是横向滚动：
        # 横着移的字读不了、复制不了，读屏也拿不到）。
        # 关键断言是**负向**那条：没被剪掉的元素不许弹 —— 否则页面会变得很吵。
        run: node test/full-tip.mjs

      - name: 事件在场人物与登场章的一致性（chars 里的人必须被该事件文案字面提到）
        # v0.156 新增。`events[].chars` 的语义是**在场人物**（app.js 靠它高亮事件卡节点、
        # 算「最后出场章」）。一个人不可能在自己出场之前在场 —— 但 validate.mjs 只查
        # **人物侧**（firstCh 类型 / 父母一致性 / 阵营有效性），**从不交叉检查 events[].chars**
        # ⇒ 这类污染「一直是隐形的」（2026-10-08 实测曾 28 处，见
        # docs/待修-事件在场人物时间矛盾.md）。
        # 本脚本的判据**不需要原著**（纯内部数据：ev.chars × firstCh × 事件文案字面命中），
        # 本可进 CI，此前却恒 exit 0（自称"只报告"）⇒ 改完就没人守了。现拆两档：
        #   · chars 侧无字面依据 ⇒ **确定是错**（应删）⇒ exit 1（本步）
        #   · 字面有据但 firstCh 晚 ⇒ 疑在 firstCh 侧 ⇒ exit 0，人工回原著核
        run: node scripts/check-event-chars.mjs

      - name: 数据校验（结构 / 引用 / 亲属 / 别名 / 时间区间）
        run: node scripts/validate.mjs --all

      - name: 亲属称谓计算（族谱推称谓：直系 / 同胞 / 伯叔 / 姑舅姨 / 堂表）
        run: node test/kin-terms.mjs

      - name: 亲属类型标签跨端一致性（KIN / KIN_HINT 的 5 处副本）
        # v0.149 新增。亲属类型标签（blood→血缘、inlaw→姻亲…）在项目里有 5 处副本：
        # scripts/kin.mjs 是权威；网页 js/app.js、编辑器 js/editor.js、小程序
        # miniprogram/utils/graph.js 与 miniprogram/pages/index/index.js 各抄一份 ——
        # 因为浏览器 / 小程序模块 import 不了 scripts/，项目对同类问题的既定策略是「手抄 + 对拍」。
        # 目前 5 处一致，但此前**没有任何测试守着**：某端单独改一个标签，
        # 就会出现「同一个 kin 在网页显示 A、在小程序显示 B」这种**用户可见**的不一致，而门禁全绿。
        # 判据：读各文件源码抽常量、与权威逐键比对（连「漏抄一个键」也能抓到）。
        run: node test/kin-constants.mjs

      - name: checkKin 规则金标（kin 与 type 自洽的唯一判据）
        # v0.150 新增。`checkKin` 是「亲属类型（kin）与关系名（type）是否自洽」的**唯一判据**，
        # validate.mjs 靠它报错（v0.147 收紧后「非 blood 配纯血缘称谓」是 error，
        # 正是靠它抓出「吴懿—刘璋 舅甥 + kin=inlaw」那两条）。但它此前**零测试覆盖**。
        # 钉返回的 level 序列（结构），不钉文案 —— 文案会改，语义不会。
        run: node test/kin-check.mjs

      - name: 亲子边定义跨端一致性（含「养父子」这类收养边）
        # v0.153 新增。「哪条关系算亲子边」这个定义在项目里抄了 **8 份以上**，已漂出 3 种行为：
        #   · 权威    scripts/kin-terms.mjs 的 isParentChild（含「养父子」）
        #   · 漏「养」 scripts/fix-gongsun.mjs / fix-wu-tail.mjs（一次性补丁，显式豁免）
        #   · 只认血缘 js/editor.js 的「亲子成环」检测 ⇒ 全部收养亲子边对编辑器不可见
        #              （三国 7 条、百年孤独 2 条）
        # 这不是新问题：scripts/lib/data-files.mjs 把它列为「同一个定义抄多份」的第 ① 例（v0.110），
        # 当时改了那三个审计脚本却**没加判据**，于是又漂了一次。
        # 判据：源码级（编辑器那份与权威逐字相同）+ 结构级（不许出现第 3 份 / 「缺养」变体）
        #       + 金标（钉「正确」而非「现状」）。浏览器侧的两条在 test/editor.mjs 里。
        run: node test/parent-child.mjs

      - name: 亲属称谓对质（手写 type 必须与族谱算出来的一致）
        # 起因 v0.99：用户报「上校—叔侄（伯父与侄）—奥雷里亚诺第二」
        # 说"第二代和第四代怎么可能只是叔侄"。手打的称谓字符串不可能自洽，
        # 而 derive-kin.mjs 有「已有直接关系的两个人不再推导」⇒ 错的标签
        # 还会把正确的推导边一起挡掉。本步让错标签**自己报出来**。
        # 族谱覆盖不足的书会整体跳过（那是数据没录全，不是缺陷）。
        #
        # ⚠ v0.115 追加 --coverage=0：那个 15% 是**代理指标**，
        #   当初存在的理由（族谱薄且未校验 ⇒ 容易误报）已被更直接的结构检查取代：
        #   audit-kin-gender 查 type 与 gender 是否自洽（**硬门禁**，见下方步骤）。
        #   （v0.154 更正）这里原先还写着另一个只读审计也是硬门禁 —— **那是错的**：
        #   它从没进过 run 步骤、还恒 exit 0，只是人工报告；判据又依赖 generation，
        #   而 generation 是部分填写的（多数人物默认 1）⇒ 含噪声，不能当判决。
        #   实测三本书在 coverage=0 下**全部 0 不一致**（三国 148 / 百年孤独 54 / 罪与罚 7），
        #   所以"跳过"今天已经挡不住任何东西 —— 继续靠跳过装作没事，不如真去跑。
        #   这一步**不改门槛默认值**，只是让门禁真的检查到三国。
        run: node scripts/check-kin-terms.mjs --all --coverage=0

      - name: 关系引文的行为人审计（引文存在 ≠ 引文支持这条关系）
        # 起因 v0.101：用户抓出一条**引文真实、行为人挂错**的关系 ——
        # 把「奥雷里亚诺第二哼着好汉弗朗西斯科的歌」挂到了上校名下，
        # 而且「师徒」这个关系类型是我编的。
        # **只出报告、退出码 0**：A/B 两级实测几乎全是误报（原文用简称、
        # 用「张、戴二人」代指两个人、代词指的正是关系一方），
        # 拿它当门禁会天天误报。这份报告是给人看的，不是判决。
        run: node scripts/audit-relation-actors.mjs

      - name: 亲子边的性别自洽（type 与 gender 必须对得上）
        # 这是**硬门禁**，与上面两个只读审计不同。
        # 起因 v0.108：靠它抓出 4 条 —— 3 条亲子边方向反了
        # （王经母 / 董太后 / 普尔赫莉雅都被填成了儿子），1 条性别填错（曹节）。
        # 而 audit-kin-direction 抓不到那 3 条：它只查**代号递增**，
        # 父子**同代**的方向错误它看不见。
        # 判据可靠：type 的四个值已经把父母性别写死（父子/父女/母子/母女），
        # gender 是独立标注的，对不上就是错 —— 不需要回原文。
        run: node scripts/audit-kin-gender.mjs

      - name: 搜索命中率审计（别名覆盖 / 译名变体 / 疑似漏人 / 同名）
        run: node scripts/audit-search.mjs --all

      - name: 小程序数据包与 data/*.json 同步（语义比对）
        # 不做"重新生成 + git diff"：布局里有 locale 依赖的排序，Windows 与
        # Ubuntu 生成的字节必然不同，字节比对会天天误报。改为解析两边深比较。
        run: node scripts/check-packs-sync.mjs

      - name: 小程序页面逻辑冒烟（不需要微信开发者工具）
        run: node miniprogram/test/smoke.mjs
