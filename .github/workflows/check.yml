      - name: firstCh 已核台账（「待核清单」里核过、确认本来就对的那几条）
        # v0.178 新增。`audit-first-ch.mjs` 把 `characters[].firstCh` 与原著首现对拍，
        # 报「待核清单」；人回原著读完，**确实错的**用 `scripts/fix-first-ch.mjs` 改数据，
        # **本来就对的**（王双在第 85 回只是被点名、司马师在第 78 回是后人诗、
        # 第 7 回的张虎是另一个人…）记进 `data/first-ch-ok.json`。
        # 台账按 **(book, 主名)** 记账，而主名与 firstCh 都会变 ⇒ 必须守：
        #   L1 数组 / L2 形状 / L3 why≥8 字 / L4 kind 在闭集 / L5 书存在 / L6 人在数据里 /
        #   L7 台账 firstCh == 数据 firstCh（数据改了台账没跟上 ⇒ 报红）/
        #   L8 firstCh − 原文首现 > 阈值（否则它不该留在台账里）/ L9 去重 /
