        # v90 新增。守住一个真实 bug：ECharts 的 graph 系列**不会**把世界坐标 1:1 画到像素上，
        # 它先把数据包围盒**等比**塞进「容器居中 80%」，再把 zoom 乘在那个适配系数之上。
        # 于是 fitPositions 里的缩放系数对渲染毫无影响（只有长宽比有意义），而
        # 「分组·横」的长宽比是 1:5.8（曹魏 250 人排一根 12500 长的竖线、群组轴才 2160），
        # 对上 2:1 的画布 ⇒ 群组轴被压到 **83px 宽**、十个阵营图注全叠在一起；
        # 再叠上"拿 zoom 当像素尺度"的 focusViewOn，点谁就把视野怼到空处 ⇒ 一片空白，
        # 只有重置才回得来。这一步量的是 zrender 里的**真实墨迹**，不是我们自己算的数。
        run: node test/render-scale.mjs

      - name: 画布漫游与视野自救（无头 Edge，真实拖动/滚轮事件）
        # v90 新增。守住用户报的两个现象：
        #   ① graphroam 事件**只同步了 zoom、从不同步 viewCenter**。而两类事件载荷各带一半 ——
        #      拖动是 {dx,dy}（没有 zoom）、滚轮是 {zoom,originX,originY}（没有位移），
        #      于是用户把画布拖到别处之后 viewCenter 永远停在 [0,0]，而 focusViewOn 判断
        #      "高亮有没有跑出视野"用的正是这个陈旧中心 ⇒ 永远算出"没跑出去" ⇒ 一点不动，
        #      只能靠「重置」或双击救回来（用户："画布跑到右侧了，碰运气滑动多次才看到"）。
        #   ② focusViewOn 的目标倍率只按高亮包围盒算，只有一两个人时包围盒被兜成 1 ⇒ 顶到 4 倍
        #      ⇒ 连点几次可见率从 77% 掉到 1.8%（zoom 一路爬到 7.84）。
        # 这一步用 **zrender 的 handler 合成真实 mousedown/mousemove/mouseup/mousewheel**
        # （CDP 的 Input.dispatchMouseEvent 在无头 Edge 里到不了页面），判据一律量 zrender 里的真实墨迹。
        run: node test/roam.mjs

