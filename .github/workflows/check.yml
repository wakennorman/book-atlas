      - name: 按书覆盖词条 + 出口页（无头 Edge）
        # v0.215 新增。回答的问题：「除了叙事类 / 理论类，诗歌、散文、议论文、科普这些
        # 要不要再做一套模板？」——结论是不用：只差几个词的书（传记的「结局→历史定论」、
