<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>书脉 BookAtlas · 人物关系与事件图谱</title>
  <meta name="description" content="把一本书的人物关系、定义关系的小事件与标志性事件放在一张图上，支持两人关系查询。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon.ico" sizes="48x48">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#1d2a53">
  <link rel="stylesheet" href="css/style.css?v=34">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img class="logo" src="assets/logo-mark.svg" alt="书脉">
    <div class="brand-text">
      <h1>书脉 <span>BookAtlas</span></h1>
      <p id="book-meta" class="meta">加载中…</p>
    </div>
  </div>
  <div class="tools">
    <label class="select-wrap">
      <span class="sr-only">选择书目</span>
      <select id="book-select" title="选择书目"></select>
    </label>
    <button id="theme-btn" class="icon-btn" type="button" title="切换深浅色">🌙 夜间</button>
    <button id="spoiler-btn" class="icon-btn" type="button" title="按阅读进度锁定，防剧透">🔓 剧透保护：关</button>
    <a class="icon-btn" href="editor.html" title="打开本地编辑器：自己新建/修改一本书">✏️ 编辑</a>
  </div>
</header>

<main>
  <section class="pane graph-pane">
    <div class="pane-head">
      <div class="search-wrap">
        <input id="search-input" list="char-list" type="search" placeholder="搜人物：上校 / 阿尔卡蒂奥 / 乌尔苏拉…" autocomplete="off">
        <datalist id="char-list"></datalist>
        <button id="search-clear" class="ghost" type="button">清空</button>
        <select id="place-filter" title="按地点筛选事件与人物"></select>
      </div>
      <div class="legend-row">
        <div id="legend" class="legend" role="group" aria-label="按阵营筛选"></div>
        <button id="label-btn" class="ghost" type="button" title="显示全部名字会重叠，默认只显示主要人物">标签：主要</button>
        <select id="size-filter" title="人太多看不清时，只显示关系较多的人物（放大后名字会越来越多）">
          <option value="all">人数：全部</option>
          <option value="mid">人数：中等（前 200）</option>
          <option value="main">人数：主要（前 60）</option>
        </select>
      </div>
      <div class="view-row" role="group" aria-label="布局方式">
        <span class="view-label">布局</span>
        <button class="seg active" type="button" data-view="force" title="力导向自由布局">自由</button>
        <button class="seg" type="button" data-view="gen-h" title="按代际分列，从左到右">代际·横</button>
        <button class="seg" type="button" data-view="gen-v" title="按代际分行，从上到下">代际·纵</button>
        <button id="reset-btn" class="ghost" type="button" title="重新布局并重置缩放/平移">重置</button>
        <button id="view-reset-btn" class="ghost" type="button" title="只复位缩放/平移，不动布局">复位视图</button>
        <button id="zoom-one-btn" class="ghost" type="button" title="跳到 1:1 缩放：节点回到原始大小，名字看得最清（大书推荐）">看清（1:1）</button>
        <button id="drag-btn" class="ghost" type="button" title="开启后可拖动单个节点（默认关，避免与画布平移打架）">拖动节点：关</button>
        <button id="mentioned-btn" class="ghost" type="button" title="「仅被提及」的人物（没出场、没台词）默认折叠">提及人物：隐藏</button>
        <button id="minor-btn" class="ghost" type="button" title="只跟一两个人有关系的次要人物，大书里默认折叠（搜索/点事件照样能找到）">次要人物：隐藏</button>
        <button id="derived-btn" class="ghost" type="button" title="由亲子关系推导出来的祖孙/曾祖孙/叔侄等族谱连线（虚线、标注「推导」；原文没有直接互动的两个人）">族谱补全：显示</button>
        <span id="count-hint" class="hint"></span>
        <span class="view-label shape-legend" title="形状区分：圆＝男，圆角方＝女（大小表示关系多少）"><i class="sh sh-m"></i>男 <i class="sh sh-f"></i>女</span>
      </div>
    </div>

    <div id="focus-bar" class="focus-bar" hidden></div>
    <div id="graph" aria-label="人物关系网络图"></div>

    <div class="pathbar">
      <span class="pathbar-label">两人关系</span>
      <select id="path-a" aria-label="人物 A"></select>
      <span class="arrow">→</span>
      <select id="path-b" aria-label="人物 B"></select>
      <button id="path-go" class="primary" type="button">查询</button>
      <button id="path-clear" class="ghost" type="button">清除</button>
      <span id="path-hint" class="hint"></span>
    </div>
  </section>

  <aside class="side">
    <div id="panel" class="panel">
      <p class="hint">点节点看人物档案 · 点连线看关系与「定义关系的小事件」 · 拖拽可移动节点</p>
    </div>
    <div class="panel timeline-panel">
      <div class="pane-head">
        <h2>重大事件轴</h2>
        <span class="hint">按阶段 · 点事件看详情</span>
      </div>
      <div id="timeline" class="timeline"></div>
    </div>
  </aside>
</main>

<footer class="footer">
  <span id="footer-note">数据：精读整理 + 公开资料核对 · 阅读辅助用途</span>
</footer>

<div id="spoiler-modal" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="spoiler-title">
    <div class="modal-head">
      <h2 id="spoiler-title">开始前，先选一条路线</h2>
      <button type="button" class="modal-close" id="spoiler-close" title="关闭（＝不开启剧透保护，全部解锁）">✕</button>
    </div>
    <p class="hint">这本书有情节。选「我在读」后，你进度之后的人物、关系与事件都会被锁起来，避免剧透。</p>
    <div class="spoiler-options">
      <button type="button" class="spoiler-opt" id="spoiler-off">
        <b>① 我不介意剧透，全部解锁</b>
        <span>直接看完整关系图</span>
      </button>
      <div class="spoiler-opt" id="spoiler-on-box">
        <b>② 我在读，按进度解锁</b>
        <span>我读到了：<select id="spoiler-ch"></select></span>
        <button type="button" class="primary" id="spoiler-on">按这个进度解锁</button>
      </div>
    </div>
    <p class="hint">点「✕」关闭＝不开启保护（全部解锁）；之后随时可以点右上角「剧透保护」修改。</p>
  </div>
</div>

<script src="vendor/echarts.min.js"></script>
<script src="js/app.js?v=34"></script>
</body>
</html>
